path = "tests/cmd_test_signature.rs"

# t10 passkeys. Its own target rather than a member of `api-auth`: it carries a software
# authenticator (a P-256 key, a CBOR writer, the `authenticatorData` byte layout) that nothing else
# in that suite needs, and keeping it separate means a passkey failure names the passkey target
# instead of reporting as "auth suite red".
[[test]]
name = "passkeys"
path = "tests/passkeys.rs"
