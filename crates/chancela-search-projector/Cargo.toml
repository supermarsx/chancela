[package]
name = "chancela-search-projector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
description = "Separate durable full-search projection service for Chancela."

[[bin]]
name = "chancela-search-projector"
path = "src/main.rs"

[features]
default = []
sqlcipher = [
    "chancela-runtime-config/sqlcipher",
    "chancela-store/sqlcipher",
]
postgres = [
    "chancela-runtime-config/postgres",
    "chancela-search-projection/postgres",
    "chancela-store/postgres",
]

[dependencies]
chancela-search.workspace = true
chancela-search-projection.workspace = true
chancela-runtime-config.workspace = true
chancela-store.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true
