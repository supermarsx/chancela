[package]
name = "chancela-cmd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
description = "Chave Movel Digital qualified remote-signature JSON/REST client (AMA SCMD AppSCMDService); produces a RawSignature (spec 04, SIG-02)."

[dependencies]
chancela-cades = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
x509-cert = { workspace = true }
der = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
zeroize = "1"

[dev-dependencies]
serde_json = { workspace = true }
# Test-only CSPRNG (`OsRng`) for the network diagnostic; the library itself deliberately does not
# pull a `getrandom`-enabled RNG (callers supply one) — this is a dev-dependency, so that holds.
rand_core = { workspace = true }

[features]
# Enables `#[ignore]`d tests that hit the real SCMD preprod endpoint. Never runs in CI.
network-tests = []
