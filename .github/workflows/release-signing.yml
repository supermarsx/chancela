name: Release signing (opt-in)

# Opt-in, secret-gated signing pipeline. This workflow is INERT by default: with
# no signing identity configured it pushes nothing, signs nothing, and records an
# honest "unsigned / not performed" status for every artifact. It performs real
# signing ONLY when the operator supplies the credentials documented in
# docs/release-signing.md, and the recorded releaseTrust reflects exactly what ran.
#
# It is deliberately a SEPARATE workflow from ci.yml / release.yml: the release
# packages remain unsigned-dev, the Docker smoke is local-ci, and normal GHCR
# publication is recorded as published-unsigned. Those paths must never carry
# signing commands. This workflow is the single place where signing is activated.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing GitHub release tag (e.g. v26.1.0) whose desktop/binary artifacts
          should be downloaded and code-signed/notarized. Leave blank to skip
          desktop artifact signing.
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-signing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Container signing is a digest-only consumer of normal main CI. It never
  # builds, pushes, or tags an image. A configured signer must discover the
  # successful main push for this exact commit, download that run's validated
  # three-image set, and sign every immutable digest in it.
  # ---------------------------------------------------------------------------
  container:
    name: Sign validated GHCR image-set digests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the exact successful normal-CI image-set artifact
      packages: write # cosign stores signatures as GHCR referrers; no image/tag write
      id-token: write # keyless Fulcio identity; unused in key-based/disabled modes
    env:
      SOURCE_DIR: dist/source-ghcr-publication
      STATUS_DIR: dist/release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve signer and successful main CI source run
        id: cfg
        env:
          KEYLESS: ${{ vars.RELEASE_SIGNING_COSIGN_KEYLESS }}
          HAVE_COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          enabled=false
          mode=none
          if [ "${KEYLESS:-}" = "true" ] && [ "${HAVE_COSIGN_KEY:-}" = "true" ]; then
            echo "configure exactly one container signing mode: keyless or private key, not both" >&2
            exit 1
          elif [ "${KEYLESS:-}" = "true" ]; then
            enabled=true
            mode=keyless
          elif [ "${HAVE_COSIGN_KEY:-}" = "true" ]; then
            enabled=true
            mode=key
          fi

          source_ref="$GITHUB_SHA"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            source_ref="$GITHUB_REF_NAME"
          elif [ -n "${INPUT_RELEASE_TAG:-}" ]; then
            source_ref="$INPUT_RELEASE_TAG"
          fi
          source_sha="$(git rev-parse "$source_ref^{commit}")"
          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "resolved source is not a full commit SHA: $source_sha" >&2
            exit 1
          fi
          signing_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release-signing.yml@${GITHUB_REF}"

          source_run_id=""
          source_run_attempt=""
          source_run_url=""
          if [ "$enabled" = "true" ]; then
            runs="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=${source_sha}&per_page=100"
            )"
            selected="$(
              jq -cer --arg sha "$source_sha" '
                [
                  .workflow_runs[]
                  | select(
                      .head_sha == $sha
                      and .head_branch == "main"
                      and .event == "push"
                      and .status == "completed"
                      and .conclusion == "success"
                    )
                ]
                | sort_by(.id, .run_attempt)
                | last
                | select(. != null)
              ' <<<"$runs"
            )" || {
              echo "no successful main push CI run exists for $source_sha" >&2
              exit 1
            }
            source_run_id="$(jq -er '.id' <<<"$selected")"
            source_run_attempt="$(
              jq -er \
                '.run_attempt | select(type == "number" and . >= 1 and . == floor)' \
                <<<"$selected"
            )"
            source_run_url="$(jq -er '.html_url' <<<"$selected")"
          fi

          {
            echo "enabled=$enabled"
            echo "mode=$mode"
            echo "source_sha=$source_sha"
            echo "source_run_id=$source_run_id"
            echo "source_run_attempt=$source_run_attempt"
            echo "source_run_url=$source_run_url"
            echo "artifact_name=ghcr-publication-trust-$source_sha-$source_run_id-$source_run_attempt"
            echo "signing_run_url=$signing_run_url"
            echo "identity=$identity"
          } >> "$GITHUB_OUTPUT"

          if [ "$enabled" != "true" ]; then
            echo "Container signing is disabled: configure RELEASE_SIGNING_COSIGN_KEYLESS=true or COSIGN_PRIVATE_KEY. No image-set was downloaded and no registry write occurred." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Signing enabled ($mode); consuming successful main CI run $source_run_url at $source_sha." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download exact normal-CI GHCR publication evidence
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.cfg.outputs.artifact_name }}
          path: ${{ env.SOURCE_DIR }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.cfg.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Validate exact complete image set and source declarations
        if: steps.cfg.outputs.enabled == 'true'
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.cfg.outputs.source_sha }}
          EXPECTED_SOURCE_RUN_URL: ${{ steps.cfg.outputs.source_run_url }}
        shell: bash
        run: |
          set -euo pipefail
          image_set="$SOURCE_DIR/chancela-image-set.json"
          test -f "$image_set"
          node scripts/check-release-trust.mjs image-set \
            --input "$image_set" \
            --expect-commit "$EXPECTED_SOURCE_SHA"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_url "$EXPECTED_SOURCE_RUN_URL" '
              .source.repository == $repository
              and .workflowRunUrl == $run_url
              and ([.images[].name] | sort
                == ["search-projector", "server", "worker"])
              and all(.images[];
                (.reference | test(
                  "^ghcr\\.io/[a-z0-9_.-]+/chancela-(server|worker|search-projector)@sha256:[a-f0-9]{64}$"
                ))
              )
            ' "$image_set" >/dev/null
          for name in server worker search-projector; do
            node scripts/check-release-trust.mjs docker \
              --input "$SOURCE_DIR/chancela-$name-signing-status.json" \
              --image-set "$image_set" \
              --expect-mode published-unsigned
          done

      - name: Log in to GHCR for signature referrers
        if: steps.cfg.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        if: steps.cfg.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify all three exact image digests (keyless)
        if: steps.cfg.outputs.enabled == 'true' && steps.cfg.outputs.mode == 'keyless'
        id: sign-keyless
        env:
          SIGNING_WORKFLOW_IDENTITY: ${{ steps.cfg.outputs.identity }}
        shell: bash
        run: |
          set -euo pipefail
          image_set="$SOURCE_DIR/chancela-image-set.json"
          identity="$SIGNING_WORKFLOW_IDENTITY"

          for name in server worker search-projector; do
            reference="$(
              jq -er --arg name "$name" \
                '.images[] | select(.name == $name) | .reference' \
                "$image_set"
            )"
            cosign sign --yes "$reference"
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$reference" >/dev/null
          done

          echo "signing_identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Sign and verify all three exact image digests (private key)
        if: steps.cfg.outputs.enabled == 'true' && steps.cfg.outputs.mode == 'key'
        id: sign-key
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          image_set="$SOURCE_DIR/chancela-image-set.json"
          public_key="$RUNNER_TEMP/cosign-public.pem"
          cosign public-key --key env://COSIGN_PRIVATE_KEY >"$public_key"
          certificate_fingerprint="sha256:$(sha256sum "$public_key" | cut -d' ' -f1)"

          for name in server worker search-projector; do
            reference="$(
              jq -er --arg name "$name" \
                '.images[] | select(.name == $name) | .reference' \
                "$image_set"
            )"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$reference"
            cosign verify --key "$public_key" "$reference" >/dev/null
          done

          echo "certificate_fingerprint=$certificate_fingerprint" >> "$GITHUB_OUTPUT"

      - name: Record and validate signed digest declarations
        if: steps.cfg.outputs.enabled == 'true'
        env:
          SOURCE_PUBLICATION_RUN_URL: ${{ steps.cfg.outputs.source_run_url }}
          SIGNING_RUN_URL: ${{ steps.cfg.outputs.signing_run_url }}
          SIGNING_MODE: ${{ steps.cfg.outputs.mode }}
          SIGNING_IDENTITY_OUTPUT: ${{ steps.sign-keyless.outputs.signing_identity }}
          SIGNING_CERTIFICATE_FINGERPRINT: ${{ steps.sign-key.outputs.certificate_fingerprint }}
          SIGNING_WORKFLOW_NAME: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STATUS_DIR"
          image_set="$SOURCE_DIR/chancela-image-set.json"
          for name in server worker search-projector; do
            entry="$(jq -cer --arg name "$name" '.images[] | select(.name == $name)' "$image_set")"
            reference="$(jq -er '.reference' <<<"$entry")"
            repository="$(jq -er '.repository' <<<"$entry")"
            digest="$(jq -er '.tagDigest' <<<"$entry")"
            platform_digest="$(jq -er '.platformDigest' <<<"$entry")"
            resolution="$(jq -er '.resolution' <<<"$entry")"
            output="$STATUS_DIR/chancela-$name-signing-status.json"
            evidence_args=()
            if [ -n "$SIGNING_IDENTITY_OUTPUT" ]; then
              evidence_args+=(--identity "$SIGNING_IDENTITY_OUTPUT")
            else
              evidence_args+=(--cert-fingerprint "$SIGNING_CERTIFICATE_FINGERPRINT")
            fi
            node scripts/release-signing-status.mjs container \
              --output "$output" \
              --image "$reference" \
              --pushed --signed --attested \
              --digest "$digest" \
              --attestation-digest "$platform_digest" \
              --publication-run-url "$SOURCE_PUBLICATION_RUN_URL" \
              --signing-run-url "$SIGNING_RUN_URL" \
              "${evidence_args[@]}" \
              --signer "cosign $SIGNING_MODE ($SIGNING_WORKFLOW_NAME)" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --registry "ghcr.io" \
              --repository "$repository"
            tmp="$(mktemp)"
            jq \
              --arg manifest "chancela-image-set.json" \
              --arg platform_digest "$platform_digest" \
              --arg resolution "$resolution" \
              '. + {
                imageSetManifest: $manifest,
                platformDigest: $platform_digest,
                publicationResolution: $resolution
              }' "$output" >"$tmp"
            mv "$tmp" "$output"
            node scripts/check-release-trust.mjs docker \
              --input "$output" \
              --image-set "$image_set" \
              --expect-mode production
          done
          cp "$image_set" "$STATUS_DIR/chancela-image-set.json"

      - name: Record unsigned container status
        if: steps.cfg.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STATUS_DIR"
          for name in server worker search-projector; do
            node scripts/release-signing-status.mjs container \
              --output "$STATUS_DIR/chancela-$name-signing-status.json" \
              --image "chancela-$name (signing not configured)"
          done

      - name: Validate container trust declaration
        if: steps.cfg.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in server worker search-projector; do
            node scripts/check-release-trust.mjs docker \
              --input "$STATUS_DIR/chancela-$name-signing-status.json" \
              --expect-mode local-ci
          done

      - name: Upload container signing status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chancela-container-signing-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STATUS_DIR }}/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # SBOM on release: generate a CycloneDX SBOM of the source tree and attach it to
  # the GitHub release. Enabled only for a tag/release context (tag push, or a
  # workflow_dispatch that names an existing release_tag).
  # ---------------------------------------------------------------------------
  sbom-release:
    name: Release SBOM attachment
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM asset to the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Resolve release tag
        id: rel
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag="${INPUT_TAG}"
          fi
          source_commit="$(git rev-parse HEAD)"
          if ! [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "checked-out source is not a full commit SHA: $source_commit" >&2
            exit 1
          fi
          if [ -n "$tag" ]; then
            git check-ref-format "refs/tags/$tag" >/dev/null
            tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
            release_tag="$(gh release view "$tag" --json tagName --jq '.tagName')"
            if [ "$release_tag" != "$tag" ]; then
              echo "release lookup resolved '$release_tag', expected '$tag'" >&2
              exit 1
            fi
            if [ "$source_commit" != "$tag_commit" ]; then
              echo "checked-out source $source_commit does not match release tag $tag at $tag_commit" >&2
              exit 1
            fi
          fi
          {
            echo "tag=$tag"
            echo "source_commit=$source_commit"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No release tag in context; SBOM will be generated but not attached to a release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Generating the source SBOM from release $tag at $source_commit." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate source SBOM (syft, CycloneDX)
        env:
          SOURCE_COMMIT: ${{ steps.rel.outputs.source_commit }}
          SOURCE_TAG: ${{ steps.rel.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          sbom_work_dir="$RUNNER_TEMP/chancela-source-sbom"
          mkdir -p "$sbom_work_dir" dist/release-signing
          docker run --rm --network none \
            -v "$PWD:/src:ro" \
            -v "$sbom_work_dir:/out" \
            anchore/syft:v1.46.0@sha256:473a60e3a58e29aca3aedb3e99e787bb4ef273917e44d10fcbea4330a07320bb \
            dir:/src \
            -o cyclonedx-json=/out/chancela-source-sbom.raw.cdx.json
          raw_sbom="$sbom_work_dir/chancela-source-sbom.raw.cdx.json"
          bound_sbom="$sbom_work_dir/chancela-source-sbom.cdx.json"
          jq \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_tag "$SOURCE_TAG" '
              .metadata = (.metadata // {})
              | .metadata.properties = (
                  [
                    (.metadata.properties // [])[]
                    | select(
                        .name != "chancela:source.commit"
                        and .name != "chancela:source.tag"
                      )
                  ]
                  + [{
                      name: "chancela:source.commit",
                      value: $source_commit
                    }]
                  + (
                      if $source_tag == ""
                      then []
                      else [{
                        name: "chancela:source.tag",
                        value: $source_tag
                      }]
                      end
                    )
                )
            ' "$raw_sbom" >"$bound_sbom"
          sbom="dist/release-signing/chancela-source-sbom.cdx.json"
          cp "$bound_sbom" "$sbom"
          jq -e \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_tag "$SOURCE_TAG" '
              any(.metadata.properties[];
                .name == "chancela:source.commit"
                and .value == $source_commit)
              and (
                $source_tag == ""
                or any(.metadata.properties[];
                  .name == "chancela:source.tag"
                  and .value == $source_tag)
              )
            ' "$sbom" >/dev/null

      - name: Attach SBOM to release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/release-signing/chancela-source-sbom.cdx.json --clobber
          echo "Attached chancela-source-sbom.cdx.json to release $TAG." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chancela-source-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-signing/chancela-source-sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Desktop / binary code signing + notarization hooks.
  #
  # Downloads the artifacts of an existing release (release_tag input, or the tag
  # that triggered this run) and code-signs them WHEN the platform signing identity
  # secret is present:
  #   * Windows Authenticode  -> WINDOWS_CODE_SIGN_PKCS12_BASE64 (+ _PASSWORD)
  #   * macOS codesign+notarize -> APPLE_CERTIFICATE (+ password, identity, notary creds)
  # When the identity secret is absent, the sign step is SKIPPED with a notice and an
  # honest "unsigned" status is recorded. Tauri's native signing env is also honored
  # if you build bundles here (see docs/release-signing.md).
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop code signing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # re-attach signed artifacts to the release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve desktop signing context
        id: ctx
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAVE_WIN_CERT: ${{ secrets.WINDOWS_CODE_SIGN_PKCS12_BASE64 != '' }}
          HAVE_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            platform=windows
          else
            platform=macos
          fi
          tag=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag="${INPUT_TAG}"
          fi

          mkdir -p dist/release-signing artifacts
          have_artifacts=false
          if [ -n "$tag" ]; then
            release_tag="$(gh release view "$tag" --json tagName --jq '.tagName')"
            if [ "$release_tag" != "$tag" ]; then
              echo "release lookup resolved '$release_tag', expected '$tag'" >&2
              exit 1
            fi
            if [ "$platform" = "windows" ]; then
              patterns=(--pattern '*.exe' --pattern '*.msi')
            else
              patterns=(--pattern '*.dmg' --pattern '*.app.tar.gz')
            fi
            if gh release download "$tag" --dir artifacts "${patterns[@]}"; then
              if [ -n "$(ls -A artifacts 2>/dev/null)" ]; then
                have_artifacts=true
              fi
            else
              echo "No matching desktop artifacts found on release $tag for $platform." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo "platform=$platform"
            echo "tag=$tag"
            echo "have_artifacts=$have_artifacts"
            echo "have_win_cert=${HAVE_WIN_CERT:-false}"
            echo "have_apple_cert=${HAVE_APPLE_CERT:-false}"
          } >> "$GITHUB_OUTPUT"

      - name: Sign Windows artifacts (Authenticode)
        id: sign-windows
        if: >-
          runner.os == 'Windows' &&
          steps.ctx.outputs.have_artifacts == 'true' &&
          steps.ctx.outputs.have_win_cert == 'true'
        env:
          PKCS12_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_PKCS12_BASE64 }}
          PKCS12_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'code-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PKCS12_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on runner' }
          Get-ChildItem artifacts -Include *.exe,*.msi -Recurse | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:PKCS12_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
          }
          Remove-Item $pfx -Force
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign + notarize macOS artifacts
        id: sign-macos
        if: >-
          runner.os == 'macOS' &&
          steps.ctx.outputs.have_artifacts == 'true' &&
          steps.ctx.outputs.have_apple_cert == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/codesign.keychain-db"
          keychain_pw="$(openssl rand -base64 24)"
          cert_path="$RUNNER_TEMP/apple-cert.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$cert_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_pw" "$keychain" >/dev/null
          rm -f "$cert_path"

          ticket=""
          while IFS= read -r -d '' artifact; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" --keychain "$keychain" "$artifact"
            xcrun notarytool submit "$artifact" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$artifact" || true
            ticket="notarized:$(basename "$artifact")"
          done < <(find artifacts \( -name '*.dmg' -o -name '*.app.tar.gz' \) -print0)

          security delete-keychain "$keychain" || true
          {
            echo "signed=true"
            echo "notarized=true"
            echo "ticket=$ticket"
          } >> "$GITHUB_OUTPUT"

      - name: Record desktop signing status
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WINDOWS_SIGNED: ${{ steps.sign-windows.outputs.signed }}
          MACOS_SIGNED: ${{ steps.sign-macos.outputs.signed }}
          MACOS_NOTARIZED: ${{ steps.sign-macos.outputs.notarized }}
          MACOS_NOTARIZATION_TICKET: ${{ steps.sign-macos.outputs.ticket }}
        run: |
          set -euo pipefail
          platform="${{ steps.ctx.outputs.platform }}"
          artifact_name="$(ls artifacts 2>/dev/null | head -n1 || true)"
          [ -n "$artifact_name" ] || artifact_name="chancela-desktop-$platform"
          args=(desktop --output "dist/release-signing/desktop-signing-status-$platform.json" \
            --platform "$platform" --artifact "$artifact_name" --run-url "$RUN_URL")
          if [ "$platform" = "windows" ] && [ "$WINDOWS_SIGNED" = "true" ]; then
            args+=(--signed --signer "Windows Authenticode certificate")
          fi
          if [ "$platform" = "macos" ] && [ "$MACOS_SIGNED" = "true" ]; then
            args+=(--signed --signer "Apple Developer ID Application")
            if [ "$MACOS_NOTARIZED" = "true" ]; then
              args+=(--notarized --notarization-ticket "$MACOS_NOTARIZATION_TICKET")
            fi
          fi
          node scripts/release-signing-status.mjs "${args[@]}"
          if ! grep -q '"status": "signed"' "dist/release-signing/desktop-signing-status-$platform.json"; then
            echo "No $platform code-signing identity configured; artifacts left unsigned (honest status recorded)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Re-attach signed artifacts to release
        if: >-
          steps.ctx.outputs.have_artifacts == 'true' &&
          (steps.sign-windows.outputs.signed == 'true' || steps.sign-macos.outputs.signed == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ctx.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f -print0 | xargs -0 -I{} gh release upload "$TAG" "{}" --clobber

      - name: Upload desktop signing status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chancela-desktop-signing-status-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-signing/
          if-no-files-found: ignore
          retention-days: 30
