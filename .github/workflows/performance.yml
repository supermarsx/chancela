name: Performance evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/performance.yml"
      - "scripts/perf/**"
      - "scripts/ha-soak/**"
      - "scripts/docker-smoke.sh"
      - "scripts/docker-smoke.ps1"
      - "scripts/search-projector-postgres-smoke.sh"
      - "scripts/search-projector-sqlite-input-smoke.sh"
      - "docs/performance-capacity.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/chancela-api/**"
      - "crates/chancela-runtime-config/**"
      - "crates/chancela-search/**"
      - "crates/chancela-search-projector/**"
      - "crates/chancela-store/**"
      - "docker/docker-compose.yml"
      - "docker/docker-compose.cluster.yml"
      - "docker/Dockerfile.server"
      - "docker/Dockerfile.search-projector"
      - "docker/preflight-secrets.sh"
      - "docker/search-projector-role-init.sh"
      - "docker/search-runtime-init.sh"
      - "docker/secrets-init.sh"
      - "docker/secrets/**"
  pull_request:
    paths:
      - ".github/workflows/performance.yml"
      - "scripts/perf/**"
      - "scripts/ha-soak/**"
      - "scripts/docker-smoke.sh"
      - "scripts/docker-smoke.ps1"
      - "scripts/search-projector-postgres-smoke.sh"
      - "scripts/search-projector-sqlite-input-smoke.sh"
      - "docs/performance-capacity.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/chancela-api/**"
      - "crates/chancela-runtime-config/**"
      - "crates/chancela-search/**"
      - "crates/chancela-search-projector/**"
      - "crates/chancela-store/**"
      - "docker/docker-compose.yml"
      - "docker/docker-compose.cluster.yml"
      - "docker/Dockerfile.server"
      - "docker/Dockerfile.search-projector"
      - "docker/preflight-secrets.sh"
      - "docker/search-projector-role-init.sh"
      - "docker/search-runtime-init.sh"
      - "docker/secrets-init.sh"
      - "docker/secrets/**"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      profile:
        description: Exact-volume profile. Capacity/soak use the committed policy; pr-smoke is non-proof.
        required: true
        type: choice
        options:
          - capacity
          - soak
          - pr-smoke
        default: capacity
      cryptographic_signatures:
        description: Opt-in count of real local PKCS#12 signatures (0 disables; manual runs only).
        required: false
        type: number
        default: 0
      keep_failed_topology:
        description: Retain containers until job cleanup for live inspection.
        required: false
        type: boolean
        default: false
      app_replicas:
        description: Application replicas recorded by topology preflight (1-9).
        required: true
        type: number
        default: 3
      app_cpus:
        description: CPU limit per application replica.
        required: true
        type: string
        default: "2.0"
      app_memory:
        description: Memory limit per application replica.
        required: true
        type: string
        default: "1g"
      search_readiness_timeout_seconds:
        description: Maximum wait for a current searchable generation after exact seeding.
        required: true
        type: number
        default: 900

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-self-test:
    name: Harness self-test (not capacity proof)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PC/SC system deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd
      - name: Compile and unit-test the harness
        run: |
          python -m compileall -q scripts/perf
          python -m unittest discover -s scripts/perf/tests -v
      - name: Render the performance Compose contract without starting containers
        shell: bash
        run: |
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            docker compose \
              --project-name chancela-perf-contract \
              -f docker/docker-compose.yml \
              -f docker/docker-compose.cluster.yml \
              -f scripts/perf/docker-compose.perf.yml \
              --profile postgres --profile cluster --profile performance \
              config --format json >/dev/null
          else
            echo "::notice::Docker Compose is unavailable; the render-only contract check was skipped."
          fi
      - name: Generate and verify only the tiny PR fixture
        run: |
          python scripts/perf/harness.py generate \
            --profile scripts/perf/profiles/pr-smoke.json \
            --output-dir .perf-work/pr-smoke/dataset
          python scripts/perf/harness.py validate \
            --dataset-dir .perf-work/pr-smoke/dataset
      - name: Upload PR smoke fixture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-pr-smoke-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: .perf-work/pr-smoke/dataset/
          if-no-files-found: error
          retention-days: 7

  exact-volume-run:
    name: >-
      ${{ github.event_name == 'schedule'
          && 'Scheduled exact capacity run'
          || format('Manual {0} run', inputs.profile) }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - linux
      - x64
      - chancela-capacity
      - cpu-12-plus
    timeout-minutes: 360
    env:
      PERF_PROFILE: ${{ github.event_name == 'schedule' && 'capacity' || inputs.profile }}
      PERF_SLO_PATH: >-
        ${{ (github.event_name == 'schedule' || inputs.profile != 'pr-smoke')
            && 'scripts/perf/slo.capacity.json'
            || '' }}
      CRYPTO_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.cryptographic_signatures || 0 }}
      CHANCELA_PERF_PASSWORD: Perf-Only-Password-2026!
      CHANCELA_PERF_PKCS12_PASSPHRASE: Ephemeral-Perf-PKCS12-2026!
      CHANCELA_PERF_KEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_failed_topology && '1' || '0' }}
      CHANCELA_CLUSTER_REPLICAS: ${{ github.event_name == 'workflow_dispatch' && inputs.app_replicas || 3 }}
      CHANCELA_PERF_APP_CPUS: ${{ github.event_name == 'workflow_dispatch' && inputs.app_cpus || '2.0' }}
      CHANCELA_PERF_APP_MEMORY: ${{ github.event_name == 'workflow_dispatch' && inputs.app_memory || '1g' }}
      CHANCELA_PERF_SEARCH_PROJECTOR_CPUS: "1.5"
      CHANCELA_PERF_SEARCH_PROJECTOR_MEMORY: "1g"
      CHANCELA_PERF_SEARCH_READY_TIMEOUT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.search_readiness_timeout_seconds || 900 }}
      CHANCELA_PERF_JOB_TIMEOUT_SECONDS: 21600
      CHANCELA_PERF_PROJECT_NAME: chancela-perf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select optional cryptographic workload
        id: crypto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .perf-work
          if [[ "$CRYPTO_COUNT" =~ ^[0-9]+$ ]] && (( CRYPTO_COUNT > 0 )); then
            sh scripts/perf/generate-test-pkcs12.sh .perf-work/test-signing-identity.p12
            jq -n \
              --argjson count "$CRYPTO_COUNT" \
              '{
                schema_version: 1,
                provider: "local-pkcs12",
                count: $count,
                concurrency: 4,
                pkcs12_path: ".perf-work/test-signing-identity.p12",
                passphrase_env: "CHANCELA_PERF_PKCS12_PASSPHRASE",
                friendly_name: "Chancela ephemeral performance identity"
              }' > .perf-work/cryptographic.json
            echo "config=.perf-work/cryptographic.json" >> "$GITHUB_OUTPUT"
          else
            echo "config=" >> "$GITHUB_OUTPUT"
          fi
      - name: Run exact-volume topology and workload
        shell: bash
        run: |
          bash scripts/perf/run-compose.sh \
            "$PERF_PROFILE" \
            ".perf-work/$PERF_PROFILE" \
            "$PERF_SLO_PATH" \
            "${{ steps.crypto.outputs.config }}"
      - name: Explain non-threshold runs
        if: always() && env.PERF_SLO_PATH == ''
        run: |
          echo "::notice::No reviewed SLO file was supplied. The report must say not_configured and is not a performance pass."
      - name: Publish proof classification
        if: always()
        shell: bash
        run: |
          report=".perf-work/$PERF_PROFILE/report/report.json"
          if [[ -f "$report" ]]; then
            assessment="$(jq -r '.slo.assessment // "not_evaluated"' "$report")"
            ready="$(jq -r '.slo.proof_ready // false' "$report")"
            blockers="$(jq -r '.slo.proof_blockers[]? // empty' "$report")"
            {
              echo "### Performance proof classification"
              echo
              echo "- Assessment: \`$assessment\`"
              echo "- Proof ready: \`$ready\`"
              if [[ -n "$blockers" ]]; then
                echo "- Blockers:"
                while IFS= read -r blocker; do
                  echo "  - $blocker"
                done <<< "$blockers"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ "$ready" != "true" ]]; then
              echo "::notice::Performance run produced evidence but is not capacity proof (assessment=$assessment)."
            fi
          else
            echo "::warning::Performance report was not produced; inspect uploaded failure logs."
          fi
      - name: Upload exact-volume evidence, reports, and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ env.PERF_PROFILE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .perf-work/${{ env.PERF_PROFILE }}/dataset/
            .perf-work/${{ env.PERF_PROFILE }}/report/
            .perf-work/${{ env.PERF_PROFILE }}/logs/
          if-no-files-found: warn
          retention-days: 30
      - name: Tear down retained topology
        if: always() && env.CHANCELA_PERF_KEEP == '1'
        shell: bash
        run: |
          docker compose \
            --project-name "$CHANCELA_PERF_PROJECT_NAME" \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.cluster.yml \
            -f scripts/perf/docker-compose.perf.yml \
            --profile postgres --profile cluster --profile performance \
            down -v --remove-orphans
