name: CI

on:
  workflow_dispatch:
    inputs:
      enforce_security_scans:
        description: Fail report-only dependency/image vulnerability scans when they return findings or errors.
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# Keep every running main publication alive. Pull-request runs still cancel when
# superseded, while main pushes are keyed by commit so one push can never abort
# another commit's release evidence.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # Metadata: cheap release metadata guard that fails before heavier builds.
  # ---------------------------------------------------------------------------
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # check:spec-coverage resolves the recorded implementation-snapshot
          # commit with `git rev-parse <sha>^{commit}`; a shallow clone does not
          # contain it. This is the only job that needs full history.
          fetch-depth: 0

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Activate npm 12.0.1
        run: npm install --global npm@12.0.1

      - name: Check release versions
        run: npm run check:versions

      - name: Check spec coverage tracker
        run: npm run check:spec-coverage

      # ci.coverage.thresholds.non_web_unit: browser/desktop/Docker/live-provider
      # coverage thresholds remain explicit waiver debt outside the apps/web
      # Vitest/V8 unit-test lane.
      - name: Check CI assurance waivers
        run: npm run check:ci-assurance-waivers

      - name: Check live-provider assurance gates
        run: npm run check:live-provider-assurance

      - name: Check encrypted build defaults
        run: npm run check:encrypted-build-defaults

      - name: Check immutable supply-chain pins
        run: npm run check:supply-chain-pins

      - name: Check release trust validator fixtures
        run: node scripts/check-release-trust.mjs self-test

      - name: Check SBOM package linkage fixtures
        run: node scripts/release-supply-chain.mjs self-test

      - name: Check package provenance fixtures
        run: node scripts/check-package-artifacts.mjs --fixture --skip-dist

  # ---------------------------------------------------------------------------
  # Packaging contracts: cheap, deterministic guards for the isolated search
  # projector graph, Dockerfile boundary, Compose topology, and secret
  # initialization. This runs on pull requests as well as main so packaging
  # drift is rejected before the main-only image build/smoke lane.
  # ---------------------------------------------------------------------------
  packaging-contracts:
    name: Packaging and projector contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0

      - name: Check search-projector dependency boundary
        run: node scripts/check-search-projector-dependencies.mjs

      - name: Check Docker image contracts
        run: |
          node scripts/check-docker-image-contracts.mjs check
          node scripts/check-docker-image-contracts.mjs self-test

      - name: Check Compose security topology
        shell: bash
        run: |
          set -euo pipefail
          node docker/tests/compose-security-contracts.mjs
          bash scripts/hardened-postgres-compose-smoke.sh --config-check

      - name: Check secret initialization fixtures
        shell: bash
        run: |
          set -euo pipefail
          sh docker/tests/preflight-secrets-fixtures.sh
          sh docker/tests/secrets-init-fixtures.sh

      - name: Check packaging shell syntax
        shell: bash
        run: |
          set -euo pipefail
          sh -n \
            docker/preflight-secrets.sh \
            docker/secrets-init.sh \
            docker/search-runtime-init.sh \
            docker/search-projector-role-init.sh \
            docker/tests/preflight-secrets-fixtures.sh \
            docker/tests/secrets-init-fixtures.sh
          bash -n \
            scripts/search-projector-postgres-smoke.sh \
            scripts/search-projector-sqlite-input-smoke.sh \
            scripts/hardened-postgres-compose-smoke.sh

  # ---------------------------------------------------------------------------
  # Supply chain: deterministic lockfile SBOM plus advisory reports. SBOM
  # generation/check is enforced; vulnerability reports are report-only by
  # default and become blocking only for manual runs with enforce_security_scans.
  # Cargo audit is heavier, so PRs run it only when labeled run-security-scans.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply chain reports
    runs-on: ubuntu-latest
    env:
      SECURITY_SCAN_ENFORCED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enforce_security_scans == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Activate npm 12.0.1
        run: npm install --global npm@12.0.1

      - name: Generate dependency SBOM
        run: |
          mkdir -p dist/supply-chain
          node scripts/release-supply-chain.mjs sbom --output dist/supply-chain/chancela-dependency-sbom.cdx.json
          node scripts/release-supply-chain.mjs check --input dist/supply-chain/chancela-dependency-sbom.cdx.json

      - name: npm production vulnerability audit (report)
        id: npm-audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > dist/supply-chain/npm-audit-prod.json
          status=$?
          set -e

          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "npm production audit did not report high/critical findings." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm production audit returned status $status; see uploaded report artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$SECURITY_SCAN_ENFORCED" = "true" ] && [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Cargo advisory audit (report)
        id: cargo-audit
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'run-security-scans'))
        shell: bash
        run: |
          set -euo pipefail
          status=0

          if ! cargo audit --version >/dev/null 2>&1; then
            set +e
            cargo install cargo-audit --version 0.22.2 --locked
            install_status=$?
            set -e
            if [ "$install_status" -ne 0 ]; then
              status="$install_status"
              cat > dist/supply-chain/cargo-audit.json <<JSON
          {
            "status": "skipped",
            "reason": "cargo-audit could not be installed in this CI run",
            "installExitCode": $install_status
          }
          JSON
              echo "cargo-audit install failed with status $install_status; see uploaded report artifact." >> "$GITHUB_STEP_SUMMARY"
              echo "status=$status" >> "$GITHUB_OUTPUT"
              if [ "$SECURITY_SCAN_ENFORCED" = "true" ]; then
                exit "$status"
              fi
              exit 0
            fi
          fi

          set +e
          cargo audit --json > dist/supply-chain/cargo-audit-raw.json
          status=$?
          set -e

          echo "status=$status" >> "$GITHUB_OUTPUT"
          node scripts/check-cargo-audit-policy.mjs \
            --input dist/supply-chain/cargo-audit-raw.json
          echo "cargo audit raw status $status; the only accepted finding is RUSTSEC-2023-0071 on rsa 0.9.10, reviewed by 2026-08-31. The unfiltered report is uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload supply chain reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chancela-supply-chain-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/supply-chain/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Rust: format, lint (deny warnings) and test on all three desktop platforms.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # chancela-smartcard links libpcsclite via the pcsc crate; Linux needs the
      # dev headers + daemon (Windows uses WinSCard, macOS the PCSC framework).
      - name: Install PC/SC system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # Rust coverage gate. Until this job existed the repo measured NO Rust coverage
  # in CI at all — `llvm-cov` and `tarpaulin` appeared nowhere in .github/,
  # scripts/ or package.json — so the hard-90% crates and the no-regression
  # ratchet were policy in documents and nothing else.
  #
  # Linux only, and that is deliberate rather than incidental: the workspace has
  # 25 cfg(windows)/cfg(unix)/cfg(target_os) sites, so a Windows or macOS run
  # compiles different code and produces a number that is not comparable. The
  # authoritative figure is ubuntu-latest. The gate script refuses to write the
  # ratchet baseline from any other platform.
  #
  # Feature sets match what CI actually tests, not `--no-default-features`:
  # `chancela-server/e2e` (its entire test surface is gated behind it) and
  # `chancela-store/sqlcipher`. `chancela-store/postgres` is deliberately NOT
  # enabled — those tests are `#[ignore]`d without the Postgres service
  # container that only the `postgres` job provides, so turning the feature on
  # here would add several hundred never-executed lines to the denominator and
  # depress the figure without measuring anything. Measuring it properly needs
  # the service container; see .orchestration/logs/t75-coverage.md.
  #
  # Cost: a full instrumented workspace build plus the whole test suite, on the
  # order of an hour. It therefore follows the `browser-full` pattern — main,
  # workflow_dispatch, or a PR labeled `run-coverage` — rather than running on
  # every push.
  # ---------------------------------------------------------------------------
  rust-coverage:
    name: Rust coverage gate (Linux, authoritative)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-coverage'))
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install PC/SC system deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0
        with:
          components: llvm-tools-preview

      - name: Cache cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      # Installed from crates.io at a pinned version rather than via
      # taiki-e/install-action: every `uses:` in this repo must carry a 40-hex
      # SHA (scripts/check-supply-chain-pins.mjs), and a version pin here is
      # verifiable where a guessed action SHA would not be.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.11 --locked

      # --no-fail-fast so a single failing test still yields a report: a broken
      # test should fail the `rust` job, not silently blank the coverage figure.
      - name: Measure
        run: >-
          cargo llvm-cov --workspace --locked --no-fail-fast
          --features chancela-server/e2e,chancela-store/sqlcipher
          --json --output-path llvm-cov.json

      - name: Enforce thresholds
        run: node scripts/rust-coverage-gate.mjs --report llvm-cov.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-report
          path: llvm-cov.json

  # ---------------------------------------------------------------------------
  # PDF accessibility: run an independent, current veraPDF machine-validation
  # gate for both claims over TWO corpora, which prove different things:
  #
  #   1. the deterministic hand-built writer fixture — a WRITER-level guarantee
  #      that the PDF engine can emit conformant output; and
  #   2. real atas + termos de abertura for all five entity families, rendered
  #      through the shipped `chancela_templates::render` -> `pdfa::write` seam
  #      — a TEMPLATE-level guarantee, which (1) cannot give: a template whose
  #      authored structure renders non-conformantly would leave (1) green.
  #
  # Human PDF/UA checkpoints remain a release/accessibility review boundary.
  # ---------------------------------------------------------------------------
  pdfua-external:
    name: PDF/A-2u + PDF/UA-1 (veraPDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install Java 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate self-checked PDF fixture
        run: |
          mkdir -p dist/pdf-validation
          cargo run -p chancela-doc --example write_pdfua_fixture --locked -- \
            dist/pdf-validation/chancela-pdfua-fixture.pdf

      # Ten real documents: one ata + one termo de abertura per family
      # (csc, condominio, assoc, fundacao, cooperativa), each rendered from the
      # embedded catalog template the API's spine auto-generation would pick.
      # Same debug profile and same dev-dependency set as the fixture above, so
      # this reuses that build and costs only the added crate compiles.
      - name: Generate real catalog documents (ata + termo, 5 families)
        run: |
          cargo run -p chancela-doc --example write_catalog_pdfs --locked -- \
            dist/pdf-validation/catalog

      - name: Install immutable veraPDF 1.30.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/verapdf-installer.zip" \
            https://software.verapdf.org/rel/1.30/verapdf-greenfield-1.30.2-installer.zip
          echo "6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838  $RUNNER_TEMP/verapdf-installer.zip" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/verapdf-installer"
          unzip -q "$RUNNER_TEMP/verapdf-installer.zip" \
            -d "$RUNNER_TEMP/verapdf-installer"
          (
            cd "$RUNNER_TEMP/verapdf-installer/verapdf-greenfield-1.30.2"
            sh ./verapdf-install "$GITHUB_WORKSPACE/scripts/verapdf-auto-install.xml"
          )

      - name: Validate PDF/A-2u and PDF/UA-1 claims (writer fixture)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/verapdf/verapdf --flavour 2u --format json \
            dist/pdf-validation/chancela-pdfua-fixture.pdf \
            > dist/pdf-validation/verapdf-pdfa2u.json
          /tmp/verapdf/verapdf --flavour ua1 --format json \
            dist/pdf-validation/chancela-pdfua-fixture.pdf \
            > dist/pdf-validation/verapdf-pdfua1.json
          /tmp/verapdf/verapdf --flavour 2u --format text \
            dist/pdf-validation/chancela-pdfua-fixture.pdf
          /tmp/verapdf/verapdf --flavour ua1 --format text \
            dist/pdf-validation/chancela-pdfua-fixture.pdf

      # One veraPDF invocation per (document, flavour) rather than one batch
      # call over all ten: attribution is then ours, not something a reader has
      # to reconstruct from a merged report. Every document is validated even
      # after the first failure, so one run tells you the full blast radius of
      # a template defect (one family, or all of them). Costs ~20 JVM starts.
      - name: Validate PDF/A-2u and PDF/UA-1 claims (real catalog documents)
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          docs=(dist/pdf-validation/catalog/*.pdf)
          if [ "${#docs[@]}" -eq 0 ]; then
            echo "::error::the catalog generator produced no PDFs — the template-level gate validated nothing"
            exit 1
          fi
          reports=dist/pdf-validation/catalog-reports
          mkdir -p "$reports"

          failures=()
          for pdf in "${docs[@]}"; do
            doc="$(basename "$pdf" .pdf)"
            for flavour in 2u ua1; do
              log="$reports/$doc.$flavour.txt"
              echo "----- veraPDF --flavour $flavour  $doc -----"
              if /tmp/verapdf/verapdf --flavour "$flavour" --format text "$pdf" \
                   > "$log" 2>&1; then
                cat "$log"
                echo "PASS  flavour=$flavour  document=$doc"
              else
                cat "$log"
                # The veraPDF text report names each failed rule (specification
                # clause + test number + description), so this annotation plus
                # the block above answers both "which document" and "which rule".
                echo "::error file=crates/chancela-templates/assets::veraPDF REJECTED $doc under flavour $flavour — failed rules are listed in the block above and in $log"
                failures+=("$doc ($flavour)")
              fi
            done
          done

          echo
          echo "validated ${#docs[@]} real documents x 2 flavours; ${#failures[@]} rejection(s)"
          if [ "${#failures[@]}" -ne 0 ]; then
            printf 'REJECTED: %s\n' "${failures[@]}"
            exit 1
          fi

      - name: Upload external validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chancela-pdf-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/pdf-validation/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # SQLCipher: compile and run the opt-in encrypted-store tests on Windows with
  # a native Win32 Perl pinned ahead of vendored OpenSSL's build. Without this,
  # openssl-src may discover an incompatible Unix/Cygwin perl.exe first.
  # ---------------------------------------------------------------------------
  sqlcipher:
    name: SQLCipher feature (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install native Perl for vendored OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install strawberryperl --version=5.40.4.1 --no-progress --yes

          $perlBin = 'C:\Strawberry\perl\bin'
          $cBin = 'C:\Strawberry\c\bin'
          if (-not (Test-Path (Join-Path $perlBin 'perl.exe'))) {
            throw "Pinned Strawberry Perl was not installed at $perlBin"
          }

          "$perlBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$cBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PERL=$perlBin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $env:Path = "$perlBin;$cBin;$env:Path"
          perl -MConfig -e 'print qq(perl=$^X\narch=$Config{archname}\nversion=$]\n)'

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Run SQLCipher feature tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $perl = (Get-Command perl -ErrorAction Stop).Source
          if ($perl -notlike 'C:\Strawberry\perl\bin\perl.exe') {
            throw "Expected Strawberry Perl first on PATH, got $perl"
          }
          cargo test -p chancela-store --locked --features sqlcipher sqlcipher

  # ---------------------------------------------------------------------------
  # Postgres store: run an existing ignored chancela-store live-backend test
  # against a disposable GitHub Actions PostgreSQL service. This is deliberately
  # limited to the store integration test binary; API seed/cluster/feed/sidecar
  # live tests stay opt-in and ignored.
  # ---------------------------------------------------------------------------
  postgres:
    name: Postgres store backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: chancela
          POSTGRES_PASSWORD: chancela
          POSTGRES_DB: chancela_store_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chancela -d chancela_store_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chancela:chancela@localhost:5432/chancela_store_ci
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # chancela-api's Postgres test links the smart-card feature graph through
      # pcsc-sys; install the same Linux PC/SC development dependency used by
      # the Rust, coverage, and E2E jobs before Cargo resolves that graph.
      - name: Install PC/SC system deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd

      - name: Enable verified TLS on the Postgres service
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          cert_dir="${RUNNER_TEMP}/chancela-postgres-tls"
          mkdir -p "$cert_dir"

          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout "$cert_dir/ca.key" \
            -out "$cert_dir/ca.crt" \
            -subj "/CN=Chancela CI Postgres Root" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -keyout "$cert_dir/server.key" \
            -out "$cert_dir/server.csr" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -addext "basicConstraints=critical,CA:FALSE" \
            -addext "keyUsage=critical,digitalSignature,keyEncipherment" \
            -addext "extendedKeyUsage=serverAuth"
          openssl x509 -req -sha256 -days 1 \
            -in "$cert_dir/server.csr" \
            -CA "$cert_dir/ca.crt" \
            -CAkey "$cert_dir/ca.key" \
            -CAcreateserial \
            -out "$cert_dir/server.crt" \
            -copy_extensions copy

          pgdata="$(docker exec "$POSTGRES_CONTAINER_ID" sh -c 'printf %s "$PGDATA"')"
          docker cp "$cert_dir/server.crt" "$POSTGRES_CONTAINER_ID:$pgdata/server.crt"
          docker cp "$cert_dir/server.key" "$POSTGRES_CONTAINER_ID:$pgdata/server.key"
          docker cp "$cert_dir/ca.crt" "$POSTGRES_CONTAINER_ID:/tmp/chancela-ci-ca.crt"
          docker exec -u root "$POSTGRES_CONTAINER_ID" \
            chown postgres:postgres "$pgdata/server.crt" "$pgdata/server.key"
          docker exec -u root "$POSTGRES_CONTAINER_ID" chmod 600 "$pgdata/server.key"

          docker exec -u postgres "$POSTGRES_CONTAINER_ID" \
            psql -U chancela -d chancela_store_ci -v ON_ERROR_STOP=1 \
              -c "ALTER SYSTEM SET ssl = 'on'"
          docker exec -u postgres "$POSTGRES_CONTAINER_ID" \
            psql -U chancela -d chancela_store_ci -v ON_ERROR_STOP=1 \
              -c "ALTER SYSTEM SET ssl_cert_file = '$pgdata/server.crt'"
          docker exec -u postgres "$POSTGRES_CONTAINER_ID" \
            psql -U chancela -d chancela_store_ci -v ON_ERROR_STOP=1 \
              -c "ALTER SYSTEM SET ssl_key_file = '$pgdata/server.key'"
          docker restart "$POSTGRES_CONTAINER_ID"

          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER_ID" \
              pg_isready -U chancela -d chancela_store_ci >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              docker logs "$POSTGRES_CONTAINER_ID"
              exit 1
            fi
            sleep 1
          done

          tls_active="$(docker exec -e PGPASSWORD=chancela "$POSTGRES_CONTAINER_ID" \
            psql "host=localhost port=5432 user=chancela dbname=chancela_store_ci sslmode=verify-full sslrootcert=/tmp/chancela-ci-ca.crt" \
              -tAc 'SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()')"
          test "$tls_active" = "t"
          echo "CHANCELA_PG_TLS_ROOT_CERT=$cert_dir/ca.crt" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Run live Postgres store backend runtime test
        run: |
          cargo test -p chancela-store --features postgres --locked --test postgres_backend runtime_reads_and_writes_roundtrip_on_postgres -- --ignored --test-threads=1
          cargo test -p chancela-store --features postgres --locked --test postgres_backend sslmode_verify_full_opens_and_roundtrips_on_postgres -- --ignored --test-threads=1
          cargo test -p chancela-api --features postgres --locked --lib search::tests::postgres_two_node_search_promotion_discards_interrupted_generation -- --ignored --exact --test-threads=1

  # ---------------------------------------------------------------------------
  # Web: format, lint, test and build the @chancela/web workspace on supported
  # Node LTS, using the committed root npm lockfile.
  # ---------------------------------------------------------------------------
  web:
    name: Web (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Activate npm 12.0.1
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check --workspace apps/web

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Test with coverage thresholds
        run: npm run test:coverage --workspace apps/web

      - name: Build
        run: npm run build --workspace apps/web

  # ---------------------------------------------------------------------------
  # Recent landed checkpoint: focused regression lane for areas that landed in
  # parallel and are easy to miss in broad jobs: API paper import,
  # archive-package evidence including /DocTimeStamp, local PKCS#12 signing,
  # bounded retention, data key preflight, TSL hardening, MCP resources/prompts,
  # web contract/dashboard/signing/template/i18n pins, static browser E2E markers,
  # validator corpus manifest integrity, and desktop Cargo.lock resolution.
  # ---------------------------------------------------------------------------
  recent-landed:
    name: Recent landed checkpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install PC/SC system deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Activate npm 12.0.1
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run recent landed checkpoint
        run: npm run test:checkpoint:recent-landed

  # ---------------------------------------------------------------------------
  # Docker: prove the server, connector worker, and isolated search-projector
  # images build and boot with durable persistence.
  # Kept off pull requests (the release build is slow) so PR feedback stays
  # fast; it gates pushes to main and can be run manually. No push.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build + smoke (server + worker + search projector)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    env:
      SECURITY_SCAN_ENFORCED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enforce_security_scans == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare Docker metadata
        id: docker-meta
        shell: bash
        run: |
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Compose profiles
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker/docker-compose.yml --profile single-node config --quiet
          docker compose -f docker/docker-compose.yml --profile postgres config --quiet
          docker compose -f docker/docker-compose.yml --profile worker config --quiet
          docker compose -f docker-compose.hardened.yml --profile worker config --quiet
          docker compose -f docker-compose.hardened.yml --profile single-node config --quiet
          docker compose -f docker-compose.hardened.yml --profile postgres config --quiet

          # The backend axis and the sidecar axis have to COMPOSE. Render both
          # combinations and assert each starts exactly one API service — a
          # regression here means two API containers fighting over the host port
          # (which is what `--profile postgres --profile worker` used to do).
          for backend in single-node postgres; do
            services="$(docker compose -f docker/docker-compose.yml \
              --profile "$backend" --profile worker config --services | sort)"
            echo "$backend + worker -> $(echo $services)"
            app_count="$(printf '%s\n' "$services" | grep -c '^server-')"
            if [ "$app_count" -ne 1 ]; then
              echo "expected exactly 1 app service for '$backend + worker', got $app_count" >&2
              exit 1
            fi
            printf '%s\n' "$services" | grep -qx worker || {
              echo "worker missing from '$backend + worker'" >&2; exit 1; }
            projector_count="$(
              printf '%s\n' "$services" |
                grep -Ec '^search-projector-(sqlite|postgres)$'
            )"
            if [ "$projector_count" -ne 1 ]; then
              echo "expected exactly 1 search projector for '$backend + worker', got $projector_count" >&2
              exit 1
            fi
          done

          # Preserve the isolation contract in both Compose variants: each
          # projector has a real runtime PID cap; the Postgres projector shares
          # the API's non-DB corpus, receives only read-only secret/TLS inputs,
          # and can never acquire the authoritative writer role.
          for compose_file in docker/docker-compose.yml docker-compose.hardened.yml; do
            docker compose -f "$compose_file" --profile single-node config --format json |
              jq -e '
                .services["server-sqlite"] as $api
                | .services["search-projector-sqlite"] as $projector
                | ($api.environment.CHANCELA_SEARCH_RUNTIME == "query-only")
                  and ($api.environment.CHANCELA_SEARCH_RUNTIME_DIR
                    == "/var/lib/chancela/search-projector")
                  and ($api.environment.CHANCELA_SEARCH_HEARTBEAT_SECONDS
                    == "15")
                  and ($api.environment.CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS
                    == "600")
                  and ($projector.pids_limit == 128)
                  and ($projector.deploy.resources.limits.pids == 128)
                  and ($projector.environment.CHANCELA_SEARCH_INSTANCE_ID == null)
                  and ($projector.environment.CHANCELA_SEARCH_HEARTBEAT_SECONDS
                    == "15")
                  and ($projector.environment.CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS
                    == "600")
                  and ($projector.healthcheck.test == [
                    "CMD",
                    "/usr/local/bin/chancela-search-projector",
                    "healthcheck",
                    "--runtime-dir",
                    "/var/lib/chancela/search-projector"
                  ])
                  and ([
                    $api.volumes[]
                    | select(.target == "/var/lib/chancela")
                    | {source, read_only: (.read_only // false)}
                  ] == [{"source":"chancela-data","read_only":false}])
                  and ([
                    $projector.volumes[]
                    | select(.target == "/var/lib/chancela")
                    | {source, read_only: (.read_only // false)}
                  ] == [{"source":"chancela-data","read_only":false}])
              ' >/dev/null
            docker compose -f "$compose_file" --profile postgres config --format json |
              jq -e '
                .services["server-postgres"] as $api
                | .services["search-projector-postgres"] as $projector
                | .services["search-projector-role-init"] as $role_init
                | .services["search-runtime-init"] as $runtime_init
                | ($api.environment.CHANCELA_SEARCH_RUNTIME == "query-only")
                  and ($api.environment.CHANCELA_SEARCH_RUNTIME_DIR
                    == "/run/chancela-search")
                  and ($api.environment.CHANCELA_SEARCH_HEARTBEAT_SECONDS
                    == "15")
                  and ($api.environment.CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS
                    == "600")
                  and ($projector.pids_limit == 128)
                  and ($projector.deploy.replicas == 1)
                  and ($projector.deploy.resources.limits.pids == 128)
                  and ($projector.environment.CHANCELA_NODE_ROLE == "follower")
                  and ($projector.environment.CHANCELA_SEARCH_INSTANCE_ID == null)
                  and ($projector.environment.CHANCELA_CREDENTIAL_KEY_FILE == null)
                  and ($projector.environment.DATABASE_URL_FILE == null)
                  and ($projector.environment.CHANCELA_SEARCH_DATABASE_URL_FILE
                    == "/run/secrets/search_database_url")
                  and ($projector.environment.CHANCELA_SEARCH_RUNTIME_DIR
                    == "/run/chancela-search")
                  and ($projector.environment.CHANCELA_SEARCH_HEARTBEAT_SECONDS
                    == "15")
                  and ($projector.environment.CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS
                    == "600")
                  and ($projector.healthcheck.test == [
                    "CMD",
                    "/usr/local/bin/chancela-search-projector",
                    "healthcheck",
                    "--runtime-dir",
                    "/run/chancela-search"
                  ])
                  and ($projector.depends_on["server-postgres"].condition
                    == "service_healthy")
                  and ($projector.depends_on["search-projector-role-init"].condition
                    == "service_completed_successfully")
                  and ($api.depends_on["search-runtime-init"].condition
                    == "service_completed_successfully")
                  and ($projector.depends_on["search-runtime-init"].condition
                    == "service_completed_successfully")
                  and ($role_init.depends_on["search-runtime-init"].condition
                    == "service_completed_successfully")
                  and ($runtime_init.user == "0:0")
                  and ($runtime_init.read_only == true)
                  and ($runtime_init.network_mode == "none")
                  and ($runtime_init.pids_limit == 16)
                  and ($runtime_init.cap_drop == ["ALL"])
                  and ($runtime_init.cap_add == ["CHOWN"])
                  and ([
                    $runtime_init.volumes[]
                    | select(.target == "/runtime")
                    | {source, read_only: (.read_only // false)}
                  ] == [{"source":"chancela-search-runtime","read_only":false}])
                  and ([
                    $api.volumes[]
                    | select(.target == "/var/lib/chancela")
                    | {source, read_only: (.read_only // false)}
                  ] == [{"source":"chancela-app-data","read_only":false}])
                  and ([
                    $projector.volumes[]
                    | select(.target == "/var/lib/chancela")
                    | {source, read_only}
                  ] == [{"source":"chancela-app-data","read_only":true}])
                  and ([
                    $projector.volumes[]
                    | select(.target == "/run/chancela-search")
                    | {source, read_only: (.read_only // false)}
                  ] == [{"source":"chancela-search-runtime","read_only":false}])
                  and ([
                    $api.volumes[]
                    | select(.target == "/run/chancela-search")
                    | {source, read_only}
                  ] == [{"source":"chancela-search-runtime","read_only":true}])
              ' >/dev/null
          done
          docker compose -f docker/docker-compose.yml \
            --profile postgres config --format json |
            jq -e '
              .services["search-projector-postgres"] as $projector
              | .services["search-projector-role-init"] as $role_init
              | ([
                  $projector.volumes[]
                  | select(.target == "/run/secrets")
                  | .source
                ] == ["chancela-search-secrets"])
                and ($role_init.pids_limit == 64)
                and ($role_init.depends_on["server-postgres"].condition
                  == "service_healthy")
                and ([
                  $role_init.volumes[]
                  | select(
                      .target == "/run/postgres-password"
                      or .target == "/run/database-url"
                      or .target == "/run/search-password"
                      or .target == "/run/projector-secrets"
                    )
                  | .source
                ] | sort
                  == [
                    "chancela-database-url",
                    "chancela-postgres-password",
                    "chancela-search-password",
                    "chancela-search-secrets"
                  ])
            ' >/dev/null
          docker compose -f docker-compose.hardened.yml \
            --profile postgres config --format json |
            jq -e '
              .services["search-projector-postgres"] as $projector
              | .services["search-projector-role-init"] as $role_init
              | ([$projector.secrets[].source] | sort
                  == ["search_database_url"])
                and ([$role_init.secrets[].source] | sort
                  == [
                    "database_url",
                    "postgres_password",
                    "search_database_password",
                    "search_database_url"
                  ])
            ' >/dev/null
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.cluster.yml \
            --profile postgres --profile cluster \
            config --format json |
            jq -e '
              .services as $services
              | $services["search-projector-postgres"] as $projector
              | $services["search-projector-role-init"] as $role_init
              | $services["chancela-cluster"] as $cluster
              | (($services | keys) == [
                  "chancela-cluster",
                  "postgres",
                  "postgres-tls-init",
                  "redis",
                  "search-projector-postgres",
                  "search-projector-role-init",
                  "search-runtime-init",
                  "secrets-init"
                ])
                and ($services["server-postgres"] == null)
                and ($services["server-sqlite"] == null)
                and ($services["search-projector-sqlite"] == null)
                and ($projector.depends_on["server-postgres"] == null)
                and ($projector.environment.CHANCELA_SEARCH_INSTANCE_ID == null)
                and ($projector.environment.CHANCELA_SEARCH_RUNTIME_DIR
                  == "/run/chancela-search")
                and ($cluster.environment.CHANCELA_SEARCH_HEARTBEAT_SECONDS
                  == "15")
                and ($cluster.environment.CHANCELA_SEARCH_HEARTBEAT_SECONDS
                  == $projector.environment.CHANCELA_SEARCH_HEARTBEAT_SECONDS)
                and ($cluster.environment.CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS
                  == "600")
                and ($cluster.environment.CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS
                  == $projector.environment.CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS)
                and ($projector.depends_on["chancela-cluster"].condition
                  == "service_healthy")
                and ($projector.depends_on["search-projector-role-init"].condition
                  == "service_completed_successfully")
                and ($projector.depends_on["search-runtime-init"].condition
                  == "service_completed_successfully")
                and ($role_init.depends_on["server-postgres"] == null)
                and ($role_init.depends_on["chancela-cluster"].condition
                  == "service_healthy")
                and ($role_init.depends_on["search-runtime-init"].condition
                  == "service_completed_successfully")
                and ($cluster.depends_on["search-runtime-init"].condition
                  == "service_completed_successfully")
                and ([
                  $cluster.volumes[]
                  | select(.target == "/var/lib/chancela")
                  | {source, read_only: (.read_only // false)}
                ] == [{"source":"chancela-cluster-data","read_only":false}])
                and ([
                  $projector.volumes[]
                  | select(.target == "/var/lib/chancela")
                  | {source, read_only}
                ] == [{"source":"chancela-cluster-data","read_only":true}])
                and ([
                  $projector.volumes[]
                  | select(.target == "/run/chancela-search")
                  | {source, read_only: (.read_only // false)}
                ] == [{"source":"chancela-search-runtime","read_only":false}])
                and ([
                  $projector.volumes[]
                  | select(.target == "/run/secrets")
                  | .source
                ] == ["chancela-search-secrets"])
            ' >/dev/null

      - name: Build server image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.server
          build-args: |
            CARGO_FEATURES=chancela-server/sqlcipher chancela-server/postgres chancela-server/redis
          push: false
          load: true
          tags: chancela-server:ci
          labels: |
            org.opencontainers.image.title=Chancela server
            org.opencontainers.image.description=Chancela self-hosted server CI image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.docker-meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          load: true
          tags: chancela-worker:ci
          labels: |
            org.opencontainers.image.title=Chancela worker
            org.opencontainers.image.description=Chancela durable sync and backup worker CI image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.docker-meta.outputs.created }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build search projector image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.search-projector
          push: false
          load: true
          tags: chancela-search-projector:ci
          labels: |
            org.opencontainers.image.title=Chancela search projector
            org.opencontainers.image.description=Chancela isolated durable full-search projector CI image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.docker-meta.outputs.created }}
          cache-from: type=gha,scope=search-projector
          cache-to: type=gha,mode=max,scope=search-projector

      - name: Smoke server container
        shell: bash
        run: |
          set -euo pipefail

          data_dir="$(mktemp -d)"
          chmod 777 "$data_dir"
          container=""

          cleanup() {
            local status=$?
            if [ "$status" -ne 0 ] && [ -n "$container" ]; then
              docker logs "$container" || true
            fi
            if [ -n "$container" ]; then
              docker rm -f "$container" >/dev/null 2>&1 || true
            fi
            # The container runs as a non-root uid and can leave files the runner user cannot
            # unlink, so tidy-up is best-effort. Re-raise the real status explicitly: a trap
            # otherwise hands the step whatever the last cleanup command returned, which
            # turned a PASSING smoke into a red job.
            rm -rf "$data_dir" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          container="$(docker run -d \
            --name "chancela-server-ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            -p 127.0.0.1::8080 \
            -e CHANCELA_DATA_DIR=/data \
            -v "$data_dir:/data" \
            chancela-server:ci)"

          mapped="$(docker port "$container" 8080/tcp)"
          health_url="http://${mapped}/health"
          body=""

          for _ in {1..60}; do
            if body="$(curl -fsS "$health_url")"; then
              break
            fi
            sleep 1
          done

          if [ -z "$body" ]; then
            echo "server did not become healthy at $health_url" >&2
            exit 1
          fi

          printf '%s\n' "$body"
          HEALTH_BODY="$body" python3 - <<'PY'
          import json
          import os
          import sys

          health = json.loads(os.environ["HEALTH_BODY"])
          checks = {
              "status": health.get("status") == "ok",
              "persistent": health.get("persistent") is True,
              "ledger_verified": health.get("ledger_verified") is True,
              "store_schema_version": isinstance(health.get("store_schema_version"), int),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f"health smoke failed {failed}: {health!r}")
          PY

      - name: Smoke dedicated worker container
        shell: bash
        run: |
          set -euo pipefail

          # Layout must match docker/worker-config.example.json (source_root and
          # target roots) and the image's baked /var/lib/chancela/worker paths.
          data_dir="$(mktemp -d)"
          mkdir -p \
            "$data_dir/worker/sources" \
            "$data_dir/worker/targets/sync" \
            "$data_dir/worker/targets/backup" \
            "$data_dir/worker/queue"
          chmod -R 777 "$data_dir"
          container=""
          cleanup() {
            local status=$?
            if [ "$status" -ne 0 ] && [ -n "$container" ]; then
              docker logs "$container" || true
            fi
            if [ -n "$container" ]; then
              docker rm -f "$container" >/dev/null 2>&1 || true
            fi
            # The container runs as a non-root uid and can leave files the runner user cannot
            # unlink, so tidy-up is best-effort. Re-raise the real status explicitly: a trap
            # otherwise hands the step whatever the last cleanup command returned, which
            # turned a PASSING smoke into a red job.
            rm -rf "$data_dir" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run --rm \
            -v "$PWD/docker/worker-config.example.json:/etc/chancela-worker/config.json:ro" \
            chancela-worker:ci \
            validate-config --config /etc/chancela-worker/config.json

          container="$(docker run -d \
            --name "chancela-worker-ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp \
            -v "$data_dir:/var/lib/chancela" \
            -v "$PWD/docker/worker-config.example.json:/etc/chancela-worker/config.json:ro" \
            chancela-worker:ci)"

          for _ in {1..30}; do
            if docker exec "$container" /usr/local/bin/chancela-worker \
              healthcheck --data-dir /var/lib/chancela/worker/queue --max-age-seconds 120; then
              exit 0
            fi
            sleep 1
          done
          echo "worker heartbeat did not become healthy" >&2
          exit 1

      - name: Smoke isolated search projector beside query-only server
        shell: bash
        run: |
          set -euo pipefail

          data_dir="$(mktemp -d)"
          chmod 777 "$data_dir"
          server=""
          projector=""
          cleanup() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              [ -z "$server" ] || docker logs "$server" || true
              [ -z "$projector" ] || docker logs "$projector" || true
            fi
            [ -z "$projector" ] || docker rm -f "$projector" >/dev/null 2>&1 || true
            [ -z "$server" ] || docker rm -f "$server" >/dev/null 2>&1 || true
            rm -rf "$data_dir" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          server="$(docker run -d \
            --name "chancela-projector-server-ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            -p 127.0.0.1::8080 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp \
            -e CHANCELA_DATA_DIR=/data \
            -e CHANCELA_SEARCH_RUNTIME=query-only \
            -v "$data_dir:/data" \
            chancela-server:ci)"

          for _ in {1..60}; do
            if docker exec "$server" /usr/bin/busybox wget -q -O /dev/null \
              http://127.0.0.1:8080/health; then
              break
            fi
            sleep 1
          done
          docker exec "$server" /usr/bin/busybox wget -q -O /dev/null \
            http://127.0.0.1:8080/health

          mapped="$(docker port "$server" 8080/tcp)"
          base_url="http://${mapped}"
          password="Docker-Projector-Smoke-2026!"
          owner="$(
            curl -fsS \
              -H "Content-Type: application/json" \
              --data "{\"username\":\"projector.smoke\",\"display_name\":\"Projector Smoke\",\"password\":\"$password\"}" \
              "$base_url/v1/users"
          )"
          user_id="$(jq -er '.id' <<<"$owner")"
          session="$(
            curl -fsS \
              -H "Content-Type: application/json" \
              --data "{\"user_id\":\"$user_id\",\"password\":\"$password\"}" \
              "$base_url/v1/session"
          )"
          session_token="$(jq -er '.token' <<<"$session")"
          entity="$(
            curl -fsS \
              -H "Content-Type: application/json" \
              -H "X-Chancela-Session: $session_token" \
              --data '{"name":"ProjectorSmokeUnique2026, Lda","nipc":"500000000","seat":"Lisboa","kind":"SociedadePorQuotas"}' \
              "$base_url/v1/entities"
          )"
          entity_id="$(jq -er '.id' <<<"$entity")"

          projector="$(docker run -d \
            --name "chancela-search-projector-ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp \
            -e CHANCELA_DATA_DIR=/data \
            -e CHANCELA_SEARCH_RUNTIME_DIR=/data/search-projector \
            -v "$data_dir:/data" \
            chancela-search-projector:ci)"

          for _ in {1..60}; do
            if docker exec "$projector" /usr/local/bin/chancela-search-projector \
              healthcheck --runtime-dir /data/search-projector; then
              break
            fi
            sleep 1
          done
          docker exec "$projector" /usr/local/bin/chancela-search-projector \
            healthcheck --runtime-dir /data/search-projector

          heartbeat_dir="$data_dir/search-projector/search-projector-heartbeats"
          for _ in {1..60}; do
            if HEARTBEAT_DIR="$heartbeat_dir" python3 - <<'PY'
          import json
          import os
          import uuid
          from pathlib import Path

          paths = sorted(Path(os.environ["HEARTBEAT_DIR"]).glob("*.json"))
          if len(paths) != 1:
              raise SystemExit(1)
          path = paths[0]
          lease_id = str(uuid.UUID(path.stem))
          if lease_id != path.stem:
              raise SystemExit(1)
          heartbeat = json.loads(path.read_text(encoding="utf-8"))
          if (
              heartbeat.get("schema_version") != 2
              or heartbeat.get("service") != "chancela-search-projector"
              or heartbeat.get("lease_id") != lease_id
              or not heartbeat.get("owner")
              or not isinstance(heartbeat.get("generation"), int)
              or heartbeat["generation"] <= 0
              or not isinstance(heartbeat.get("document_count"), int)
              or heartbeat["document_count"] <= 0
              or heartbeat.get("last_error") not in (None, "")
          ):
              raise SystemExit(1)
          PY
            then
              break
            fi
            sleep 1
          done
          HEARTBEAT_DIR="$heartbeat_dir" python3 - <<'PY'
          import json
          import os
          import uuid
          from pathlib import Path

          paths = sorted(Path(os.environ["HEARTBEAT_DIR"]).glob("*.json"))
          assert len(paths) == 1, paths
          path = paths[0]
          lease_id = str(uuid.UUID(path.stem))
          assert lease_id == path.stem, path
          heartbeat = json.loads(path.read_text(encoding="utf-8"))
          assert heartbeat["schema_version"] == 2, heartbeat
          assert heartbeat["service"] == "chancela-search-projector", heartbeat
          assert heartbeat["lease_id"] == lease_id, heartbeat
          assert heartbeat["owner"], heartbeat
          assert heartbeat["generation"] > 0, heartbeat
          assert heartbeat["document_count"] > 0, heartbeat
          assert heartbeat.get("last_error") in (None, ""), heartbeat
          PY

          search_body=""
          for _ in {1..60}; do
            if search_body="$(
              curl -fsS \
                -H "X-Chancela-Session: $session_token" \
                "$base_url/v1/search?q=ProjectorSmokeUnique2026&kind=entity&limit=10"
            )" && SEARCH_BODY="$search_body" ENTITY_ID="$entity_id" python3 - <<'PY'
          import json
          import os

          response = json.loads(os.environ["SEARCH_BODY"])
          hits = response.get("page", {}).get("hits", [])
          if not any(hit.get("entity_id") == os.environ["ENTITY_ID"] for hit in hits):
              raise SystemExit(1)
          generation = response.get("index", {}).get("generation")
          if not isinstance(generation, int) or generation <= 0:
              raise SystemExit(1)
          PY
            then
              printf '%s\n' "$search_body"
              exit 0
            fi
            sleep 1
          done
          echo "query-only server did not hydrate and return the projected entity" >&2
          exit 1

      - name: Smoke SQLite projector fail-closed inputs
        shell: bash
        env:
          CHANCELA_PROJECTOR_SQLITE_SMOKE_PROJECT: chancela-projector-sqlite-input-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/search-projector-sqlite-input-smoke.sh

      - name: Smoke restricted PostgreSQL projector role + publication
        shell: bash
        env:
          CHANCELA_PROJECTOR_SMOKE_PROJECT: chancela-projector-pg-ci-${{ github.run_id }}-${{ github.run_attempt }}
          CHANCELA_PROJECTOR_DEDICATED_DATABASE: "true"
        run: bash scripts/search-projector-postgres-smoke.sh

      - name: Smoke hardened PostgreSQL secret and lifecycle wiring
        shell: bash
        env:
          CHANCELA_HARDENED_SMOKE_PROJECT: chancela-hardened-pg-ci-${{ github.run_id }}-${{ github.run_attempt }}
          CHANCELA_HARDENED_SMOKE_PORT: "18083"
          CHANCELA_PROJECTOR_DEDICATED_DATABASE: "true"
        run: bash scripts/hardened-postgres-compose-smoke.sh

      - name: Smoke single-node Compose runtime hardening
        shell: bash
        run: bash scripts/docker-smoke.sh --compose-profile chancela-server:ci

      - name: Collect Docker image metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/docker-security
          docker image inspect chancela-server:ci > dist/docker-security/chancela-server-image-inspect.json
          docker image inspect chancela-worker:ci > dist/docker-security/chancela-worker-image-inspect.json
          docker image inspect chancela-search-projector:ci > dist/docker-security/chancela-search-projector-image-inspect.json

      - name: Generate Docker image SBOM (report)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/docker-security
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/dist/docker-security:/out" \
            anchore/syft:v1.46.0@sha256:473a60e3a58e29aca3aedb3e99e787bb4ef273917e44d10fcbea4330a07320bb \
            chancela-server:ci \
            -o cyclonedx-json=/out/chancela-server-image-sbom.cdx.json
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/dist/docker-security:/out" \
            anchore/syft:v1.46.0@sha256:473a60e3a58e29aca3aedb3e99e787bb4ef273917e44d10fcbea4330a07320bb \
            chancela-worker:ci \
            -o cyclonedx-json=/out/chancela-worker-image-sbom.cdx.json
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/dist/docker-security:/out" \
            anchore/syft:v1.46.0@sha256:473a60e3a58e29aca3aedb3e99e787bb4ef273917e44d10fcbea4330a07320bb \
            chancela-search-projector:ci \
            -o cyclonedx-json=/out/chancela-search-projector-image-sbom.cdx.json

      - name: Scan Docker image vulnerabilities (report)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/docker-security
          exit_code=0
          if [ "$SECURITY_SCAN_ENFORCED" = "true" ]; then
            exit_code=1
          fi
          set +e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/dist/docker-security:/out" \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image \
            --exit-code "$exit_code" \
            --format json \
            --output /out/chancela-server-trivy-high-critical.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            chancela-server:ci
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Docker image vulnerability scan completed; see uploaded report artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Docker image vulnerability scan returned status $status; see uploaded report artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$SECURITY_SCAN_ENFORCED" = "true" ] && [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          set +e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/dist/docker-security:/out" \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image \
            --exit-code "$exit_code" \
            --format json \
            --output /out/chancela-worker-trivy-high-critical.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            chancela-worker:ci
          worker_status=$?
          set -e
          if [ "$SECURITY_SCAN_ENFORCED" = "true" ] && [ "$worker_status" -ne 0 ]; then
            exit "$worker_status"
          fi
          set +e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/dist/docker-security:/out" \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image \
            --exit-code "$exit_code" \
            --format json \
            --output /out/chancela-search-projector-trivy-high-critical.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            chancela-search-projector:ci
          projector_status=$?
          set -e
          if [ "$SECURITY_SCAN_ENFORCED" = "true" ] && [ "$projector_status" -ne 0 ]; then
            exit "$projector_status"
          fi

      - name: Record Docker signing status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/docker-security
          cat > dist/docker-security/chancela-server-signing-status.json <<'JSON'
          {
            "image": "chancela-server:ci",
            "imagePushed": false,
            "signingPerformed": false,
            "notarizationPerformed": false,
            "attestationPerformed": false,
            "releaseTrust": {
              "mode": "local-ci",
              "imagePublication": {
                "status": "not_pushed",
                "reason": "This CI job loads the Docker image locally and does not push it to a registry."
              },
              "signing": {
                "status": "unsigned",
                "reason": "No container signing identity or signing step is configured in this workflow."
              },
              "notarization": {
                "status": "not_applicable",
                "reason": "This local CI container image is not a notarized desktop artifact."
              },
              "attestation": {
                "status": "not_attested",
                "reason": "No container image attestation step is configured in this workflow."
              }
            },
            "note": "This CI job builds and smokes a local Docker image only. It does not push, sign, attest, or notarize the image. Configure registry publishing and a signing identity before making a signed-image claim."
          }
          JSON
          jq '.image = "chancela-worker:ci"' \
            dist/docker-security/chancela-server-signing-status.json \
            > dist/docker-security/chancela-worker-signing-status.json
          jq '.image = "chancela-search-projector:ci"' \
            dist/docker-security/chancela-server-signing-status.json \
            > dist/docker-security/chancela-search-projector-signing-status.json
          echo "Docker image signing/notarization: not performed for the local CI image." >> "$GITHUB_STEP_SUMMARY"

      - name: Check Docker trust declaration
        run: |
          node scripts/check-release-trust.mjs docker --input dist/docker-security/chancela-server-signing-status.json --expect-mode local-ci
          node scripts/check-release-trust.mjs docker --input dist/docker-security/chancela-worker-signing-status.json --expect-mode local-ci
          node scripts/check-release-trust.mjs docker --input dist/docker-security/chancela-search-projector-signing-status.json --expect-mode local-ci

      - name: Upload Docker security artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chancela-docker-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/docker-security/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # E2E: composed-system journeys that drive the REAL cargo-built
  # chancela-server binary over HTTP (crates/chancela-server/tests/**, gated
  # behind the `e2e` cargo feature). This is the layer every layer-isolated unit
  # test missed — the stale-server / SPA-static-fallback bug. The harness writes
  # its own synthetic web dist and spawns in-process axum registry/CAE fixtures,
  # so it needs no Node, no npm, and no apps/web build. It runs on Linux and
  # Windows for every push and PR.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (composed server, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # chancela-server's dependency tree does not link libpcsclite today, but
      # install it defensively (matching the rust job) so a future transitive
      # pcsc dep can't break the link step here.
      - name: Install PC/SC system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Run composed-system E2E journeys
        run: cargo test -p chancela-server --features e2e --locked

  # ---------------------------------------------------------------------------
  # Build the browser-test server once. Both browser suites use the exact same
  # release binary at this SHA, so compiling it independently in each job only
  # duplicated the largest part of the Rust graph.
  # ---------------------------------------------------------------------------
  browser-server-build:
    name: Browser server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install PC/SC system deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Build browser server
        run: cargo build --release -p chancela-server --locked

      - name: Upload browser server binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release/chancela-server
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Browser E2E core (Playwright, headless chromium): a normal PR/push gate for
  # the stable browser specs that prove the real built server + web bundle work
  # in Chromium. Edge and long-tail browser coverage remains in the labeled full
  # suite below.
  # ---------------------------------------------------------------------------
  browser-core:
    name: Browser E2E (Chromium core)
    runs-on: ubuntu-latest
    needs: browser-server-build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The downloaded server dynamically links PC/SC on Linux.
      - name: Install PC/SC system deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Activate npm 12.0.1
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Downloads the chromium browser + its OS deps into the Playwright cache.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Download browser server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release

      - name: Restore browser server executable bit
        run: chmod +x target/release/chancela-server

      # Build the web dist, then run the stable core browser specs.
      - name: Run core browser E2E
        working-directory: apps/web
        run: |
          npm run build
          node e2e/run-playwright-with-cleanup-proof.mjs --project=chromium \
            e2e/smoke.spec.ts \
            e2e/session.spec.ts \
            e2e/first-launch-onboarding.spec.ts \
            e2e/journey.spec.ts \
            e2e/template-pdf-preview.spec.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-core-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Browser E2E full (Playwright, headless chromium): heavier edge/regression
  # coverage. It is blocking when selected, but it stays on the main branch and
  # PRs labeled `run-browser-tests` so the normal PR path is predictable.
  # ---------------------------------------------------------------------------
  browser-full:
    name: Browser E2E (Chromium full)
    runs-on: ubuntu-latest
    needs: browser-server-build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-browser-tests'))
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install PC/SC system deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Activate npm 12.0.1
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Download browser server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release

      - name: Restore browser server executable bit
        run: chmod +x target/release/chancela-server

      - name: Run full browser E2E
        working-directory: apps/web
        run: |
          npm run build
          node e2e/run-playwright-with-cleanup-proof.mjs --project=chromium

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-full-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Live seam compile gates: compile the opt-in network/hardware test surfaces
  # without running them. These commands intentionally use --no-run so CI proves
  # live seams still build while avoiding real providers, networks, and readers.
  # ---------------------------------------------------------------------------
  live-seams:
    name: Live seam compile (no-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install PC/SC system deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Compile live network and hardware test seams
        run: |
          cargo test -p chancela-cae --features network-tests --locked --no-run
          cargo test -p chancela-cmd --features network-tests --locked --no-run
          cargo test -p chancela-csc --features network-tests --locked --no-run
          cargo test -p chancela-law --features network-tests --locked --no-run
          cargo test -p chancela-registry --features network-tests --locked --no-run
          cargo test -p chancela-tsa --features network-tests --locked --no-run
          cargo test -p chancela-tsl --features network-tests --locked --no-run
          cargo test -p chancela-smartcard --features hardware-tests --locked --no-run

  # ---------------------------------------------------------------------------
  # Desktop compile check (Tauri, Windows): a FAST per-PR/push gate that compiles
  # the out-of-workspace desktop crate against the CURRENT chancela-api public
  # surface. The root Cargo workspace excludes apps/desktop/src-tauri, so root CI
  # never builds it — a breaking change to chancela-api's public API could
  # otherwise land silently and only surface in the heavier Windows smoke below.
  # This is compile-only: `cargo check` with the default `embedded-server`
  # feature (which pulls in chancela-api) — no `sqlcipher`, so no vendored
  # OpenSSL/Perl; no bundle; no smoke. It runs on every push and PR like the
  # other quick checks; the heavier Desktop Smoke job stays on main/label.
  # ---------------------------------------------------------------------------
  desktop-check:
    name: Desktop compile check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0

      - name: Cache desktop cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      # `tauri-build` refuses to run when `frontendDist` (apps/web/dist) is absent, and this
      # gate deliberately never builds or loads the frontend — it only compiles the desktop
      # crate against chancela-api's public surface. A placeholder keeps the gate honest about
      # what it checks without dragging a full Node install + Vite build into a fast lane.
      # (Desktop Smoke, which actually runs the app, builds the real bundle.)
      - name: Provide a placeholder frontend bundle for tauri-build
        shell: bash
        run: |
          mkdir -p apps/web/dist
          printf '<!doctype html><title>compile-check placeholder</title>' > apps/web/dist/index.html

      - name: Compile-check desktop crate against chancela-api
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  # ---------------------------------------------------------------------------
  # Desktop Smoke (Tauri, Windows): builds the loose no-bundle desktop app and
  # drives its embedded server through the PowerShell smoke script. It is heavier
  # and Windows-specific, so it stays on the release-heavy path: push to main,
  # or PRs labeled `run-desktop-tests`.
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop Smoke (Windows)
    runs-on: windows-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-desktop-tests'))
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install native Perl for SQLCipher vendored OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install strawberryperl --version=5.40.4.1 --no-progress --yes

          $perlBin = 'C:\Strawberry\perl\bin'
          $cBin = 'C:\Strawberry\c\bin'
          if (-not (Test-Path (Join-Path $perlBin 'perl.exe'))) {
            throw "Pinned Strawberry Perl was not installed at $perlBin"
          }

          "$perlBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$cBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "PERL=$perlBin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $env:Path = "$perlBin;$cBin;$env:Path"
          perl -MConfig -e 'print qq(perl=$^X\narch=$Config{archname}\nversion=$]\n)'

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97.0

      - name: Cache desktop cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Activate npm 12.0.1
        run: npm install --global npm@12.0.1

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      # `tauri-build` (run by every cargo invocation on the desktop crate) requires the built
      # frontend at apps/web/dist. `build:no-bundle` produces it via beforeBuildCommand, but the
      # Rust test step runs first — so build the real bundle up front.
      - name: Build web assets for tauri-build
        run: npm run build --workspace apps/web

      - name: Test desktop Rust
        working-directory: apps/desktop
        run: npm run test:rust

      - name: Build desktop no-bundle
        working-directory: apps/desktop
        run: npm run build:no-bundle

      - name: Run desktop smoke
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'chancela-desktop-smoke'
          $dataDir = Join-Path $smokeRoot 'data'
          $logDir = Join-Path $smokeRoot 'logs'
          New-Item -ItemType Directory -Path $dataDir, $logDir -Force | Out-Null

          Start-Transcript -Path (Join-Path $logDir 'desktop-smoke.log') -Force
          try {
            npm run test:smoke -- -DataDir $dataDir
            if ($LASTEXITCODE -ne 0) {
              throw "Desktop smoke failed with exit code $LASTEXITCODE"
            }
          } finally {
            Stop-Transcript
          }

      - name: Upload desktop smoke artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-smoke-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chancela-desktop-smoke/
            apps/desktop/src-tauri/target/release/*.exe
            apps/desktop/src-tauri/target/release/*.pdb
          if-no-files-found: ignore
          retention-days: 7

  # Final normal-CI job: every required main-push job above must succeed before
  # any application image is published. BuildKit attaches provenance and an
  # SBOM, but these images are intentionally not signed.
  publish-ghcr:
    name: Publish server + worker + search projector images to GHCR
    needs:
      - metadata
      - packaging-contracts
      - supply-chain
      - rust
      - rust-coverage
      - pdfua-external
      - sqlcipher
      - postgres
      - web
      - recent-landed
      - docker
      - e2e
      - browser-server-build
      - browser-core
      - browser-full
      - live-seams
      - desktop-check
      - desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      STATUS_DIR: dist/ghcr-publication
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          created="$(date -u -d "@$source_date_epoch" +'%Y-%m-%dT%H:%M:%SZ')"
          if ! [[ "$source_date_epoch" =~ ^[0-9]+$ ]]; then
            echo "commit timestamp is not a Unix epoch: $source_date_epoch" >&2
            exit 1
          fi
          {
            echo "server=ghcr.io/$owner/chancela-server"
            echo "worker=ghcr.io/$owner/chancela-worker"
            echo "projector=ghcr.io/$owner/chancela-search-projector"
            echo "source_date_epoch=$source_date_epoch"
            echo "created=$created"
          } >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # BuildKit first pushes every application image only by its canonical
      # digest. No named tag is created until all three builds have completed.
      - name: Build and push server image by canonical digest
        id: server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.server
          build-args: |
            CARGO_FEATURES=chancela-server/sqlcipher chancela-server/postgres chancela-server/redis
            SOURCE_DATE_EPOCH=${{ steps.image.outputs.source_date_epoch }}
          platforms: linux/amd64
          provenance: mode=max,version=v1
          sbom: true
          outputs: type=image,name=${{ steps.image.outputs.server }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.title=Chancela Server
            org.opencontainers.image.description=Self-hostable ledger-backed livro de atas server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.licenses=LicenseRef-Chancela-NonCommercial
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image by canonical digest
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.worker
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.image.outputs.source_date_epoch }}
          platforms: linux/amd64
          provenance: mode=max,version=v1
          sbom: true
          outputs: type=image,name=${{ steps.image.outputs.worker }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.title=Chancela Worker
            org.opencontainers.image.description=Dedicated background worker for Chancela
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.licenses=LicenseRef-Chancela-NonCommercial
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build and push search projector image by canonical digest
        id: projector
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.search-projector
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.image.outputs.source_date_epoch }}
          platforms: linux/amd64
          provenance: mode=max,version=v1
          sbom: true
          outputs: type=image,name=${{ steps.image.outputs.projector }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.title=Chancela Search Projector
            org.opencontainers.image.description=Isolated durable full-search projector for Chancela
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.licenses=LicenseRef-Chancela-NonCommercial
          cache-from: type=gha,scope=search-projector
          cache-to: type=gha,mode=max,scope=search-projector

      - name: Reconcile immutable SHA tags and write the complete image set
        shell: bash
        env:
          SERVER_REPOSITORY: ${{ steps.image.outputs.server }}
          SERVER_BUILT_DIGEST: ${{ steps.server.outputs.digest }}
          WORKER_REPOSITORY: ${{ steps.image.outputs.worker }}
          WORKER_BUILT_DIGEST: ${{ steps.worker.outputs.digest }}
          PROJECTOR_REPOSITORY: ${{ steps.image.outputs.projector }}
          PROJECTOR_BUILT_DIGEST: ${{ steps.projector.outputs.digest }}
          COMMIT_CREATED: ${{ steps.image.outputs.created }}
          COMMIT_EPOCH: ${{ steps.image.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          mkdir -p "$STATUS_DIR/inspect"
          records="$STATUS_DIR/image-records.jsonl"
          : > "$records"

          inspect_required() {
            local reference="$1"
            local output="$2"
            docker buildx imagetools inspect "$reference" \
              --format '{{json .}}' > "$output"
          }

          # Return 0 for an existing image, 1 only for a registry-confirmed
          # absence, and 2 for authentication/network/other inspection errors.
          inspect_optional() {
            local reference="$1"
            local output="$2"
            local error_output="${output}.err"
            if docker buildx imagetools inspect "$reference" \
              --format '{{json .}}' > "$output" 2> "$error_output"; then
              rm -f "$error_output"
              return 0
            fi
            if grep -Eiq \
              '(^|[[:space:]])MANIFEST_UNKNOWN([:[:space:]]|$)|manifest unknown' \
              "$error_output" \
              || grep -Fqx "$reference: not found" "$error_output" \
              || grep -Fqx "ERROR: $reference: not found" "$error_output"; then
              rm -f "$output" "$error_output"
              return 1
            fi
            cat "$error_output" >&2
            return 2
          }

          platform_digest() {
            jq -er '
              [
                .manifest.manifests[]
                | select(
                    (
                      (.annotations["vnd.docker.reference.type"] // "")
                        == "attestation-manifest"
                      and .platform.os == "unknown"
                      and .platform.architecture == "unknown"
                    ) | not
                  )
              ] as $runnable
              | if
                  ($runnable | length) == 1
                  and $runnable[0].platform.os == "linux"
                  and $runnable[0].platform.architecture == "amd64"
                then $runnable[0].digest
                else error(
                  "expected exactly one non-attestation linux/amd64 platform manifest"
                )
                end
            ' "$1"
          }

          validate_attestation_payloads() {
            local reference="$1"
            (
              local evidence_dir
              evidence_dir="$(mktemp -d)"
              trap 'rm -rf "$evidence_dir"' EXIT
              docker buildx imagetools inspect "$reference" \
                --format '{{json .Provenance.SLSA}}' \
                > "$evidence_dir/provenance.slsa.json"
              docker buildx imagetools inspect "$reference" \
                --format '{{json .SBOM.SPDX}}' \
                > "$evidence_dir/sbom.spdx.json"
              node scripts/check-release-trust.mjs buildkit-attestations \
                --provenance "$evidence_dir/provenance.slsa.json" \
                --sbom "$evidence_dir/sbom.spdx.json"
            )
          }

          validate_contract() {
            local reference="$1"
            local document="$2"
            local expected_platform_digest="$3"
            local platform
            local revision
            local created
            platform="$(platform_digest "$document")"
            revision="$(
              jq -er '
                .image["linux/amd64"].config.Labels[
                  "org.opencontainers.image.revision"
                ]
              ' "$document"
            )"
            created="$(
              jq -er '
                .image["linux/amd64"].config.Labels[
                  "org.opencontainers.image.created"
                ]
              ' "$document"
            )"
            test "$platform" = "$expected_platform_digest"
            test "$revision" = "$GITHUB_SHA"
            test "$created" = "$COMMIT_CREATED"
            jq -e --arg platform "$platform" '
              .manifest.manifests as $descriptors
              | [
                  $descriptors[]
                  | select(
                      (
                        (.annotations["vnd.docker.reference.type"] // "")
                          == "attestation-manifest"
                        and .platform.os == "unknown"
                        and .platform.architecture == "unknown"
                      ) | not
                    )
                ] as $runnable
              | [
                  $descriptors[]
                  | select(
                      (.annotations["vnd.docker.reference.type"] // "")
                        == "attestation-manifest"
                      and .platform.os == "unknown"
                      and .platform.architecture == "unknown"
                    )
                ] as $attestations
              | ($runnable | length) == 1
                and $runnable[0].platform.os == "linux"
                and $runnable[0].platform.architecture == "amd64"
                and $runnable[0].digest == $platform
                and ($attestations | length) >= 1
                and all($attestations[];
                  (.annotations["vnd.docker.reference.digest"] // "")
                    == $platform
                )
                and (
                  ($runnable | length) + ($attestations | length)
                  == ($descriptors | length)
                )
            ' "$document" >/dev/null
            validate_attestation_payloads "$reference"
          }

          reconcile_image() {
            local name="$1"
            local repository="$2"
            local built_digest="$3"
            local tag="sha-$GITHUB_SHA"
            local tag_reference="$repository:$tag"
            local built_document="$STATUS_DIR/inspect/$name-built.json"
            local tag_document="$STATUS_DIR/inspect/$name-tag.json"
            local built_platform_digest
            local tag_digest
            local tag_platform_digest
            local resolution
            local optional_status

            inspect_required "$repository@$built_digest" "$built_document"
            test "$(jq -er '.manifest.digest' "$built_document")" = "$built_digest"
            built_platform_digest="$(platform_digest "$built_document")"
            validate_contract \
              "$repository@$built_digest" \
              "$built_document" \
              "$built_platform_digest"

            if inspect_optional "$tag_reference" "$tag_document"; then
              # A rerun preserves the pre-existing top-level digest. BuildKit
              # attestations can contain run-specific metadata, so equality is
              # intentionally enforced on the runnable platform digest and
              # source labels rather than the attestation-bearing index digest.
              resolution="preserved"
              validate_contract \
                "$tag_reference" \
                "$tag_document" \
                "$built_platform_digest"
            else
              optional_status=$?
              test "$optional_status" -eq 1

              # Recheck immediately before the only named-tag write. Main runs
              # for this commit share a non-cancelling concurrency key.
              if inspect_optional "$tag_reference" "$tag_document"; then
                resolution="preserved"
                validate_contract \
                  "$tag_reference" \
                  "$tag_document" \
                  "$built_platform_digest"
              else
                optional_status=$?
                test "$optional_status" -eq 1
                docker buildx imagetools create \
                  --tag "$tag_reference" \
                  "$repository@$built_digest"
                resolution="published"
                inspect_required "$tag_reference" "$tag_document"
                validate_contract \
                  "$tag_reference" \
                  "$tag_document" \
                  "$built_platform_digest"
              fi
            fi

            tag_digest="$(jq -er '.manifest.digest' "$tag_document")"
            tag_platform_digest="$(platform_digest "$tag_document")"
            jq -cn \
              --arg name "$name" \
              --arg repository "$repository" \
              --arg tag "$tag" \
              --arg tag_digest "$tag_digest" \
              --arg platform_digest "$tag_platform_digest" \
              --arg resolution "$resolution" \
              '{
                name: $name,
                repository: $repository,
                tag: $tag,
                tagDigest: $tag_digest,
                platform: "linux/amd64",
                platformDigest: $platform_digest,
                reference: ($repository + "@" + $tag_digest),
                resolution: $resolution
              }' >> "$records"
          }

          # All three canonical digest pushes above finish before this first
          # named-tag reconciliation.
          reconcile_image server "$SERVER_REPOSITORY" "$SERVER_BUILT_DIGEST"
          reconcile_image worker "$WORKER_REPOSITORY" "$WORKER_BUILT_DIGEST"
          reconcile_image search-projector \
            "$PROJECTOR_REPOSITORY" "$PROJECTOR_BUILT_DIGEST"

          # Re-read the whole set after the final named-tag operation. This
          # catches any changed digest before completeness is recorded.
          while IFS= read -r record; do
            name="$(jq -er '.name' <<< "$record")"
            repository="$(jq -er '.repository' <<< "$record")"
            tag="$(jq -er '.tag' <<< "$record")"
            expected_tag_digest="$(jq -er '.tagDigest' <<< "$record")"
            expected_platform_digest="$(jq -er '.platformDigest' <<< "$record")"
            final_document="$STATUS_DIR/inspect/$name-final.json"
            inspect_required "$repository:$tag" "$final_document"
            test "$(jq -er '.manifest.digest' "$final_document")" \
              = "$expected_tag_digest"
            validate_contract \
              "$repository:$tag" \
              "$final_document" \
              "$expected_platform_digest"
          done < "$records"

          # The manifest is created only after all three tags have been read
          # back and verified. Its absence means the image set is incomplete.
          jq -s \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg commit_sha "$GITHUB_SHA" \
            --argjson source_date_epoch "$COMMIT_EPOCH" \
            --arg created "$COMMIT_CREATED" \
            --arg workflow_run_url "$RUN_URL" \
            '{
              schemaVersion: 1,
              status: "complete",
              completenessBoundary:
                "workflow-green-and-image-set-manifest-present",
              source: {
                repository: $source_repository,
                commitSha: $commit_sha,
                sourceDateEpoch: $source_date_epoch,
                created: $created
              },
              workflowRunUrl: $workflow_run_url,
              images: sort_by(.name)
            }' "$records" > "$STATUS_DIR/chancela-image-set.json"

      - name: Validate complete image-set manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-trust.mjs image-set \
            --input "$STATUS_DIR/chancela-image-set.json" \
            --expect-commit "$GITHUB_SHA"

      - name: Record honest unsigned publication status at exact tag digests
        shell: bash
        run: |
          set -euo pipefail
          for name in server worker search-projector; do
            repository="$(
              jq -er --arg name "$name" \
                '.images[] | select(.name == $name) | .repository' \
                "$STATUS_DIR/chancela-image-set.json"
            )"
            digest="$(
              jq -er --arg name "$name" \
                '.images[] | select(.name == $name) | .tagDigest' \
                "$STATUS_DIR/chancela-image-set.json"
            )"
            platform_digest="$(
              jq -er --arg name "$name" \
                '.images[] | select(.name == $name) | .platformDigest' \
                "$STATUS_DIR/chancela-image-set.json"
            )"
            resolution="$(
              jq -er --arg name "$name" \
                '.images[] | select(.name == $name) | .resolution' \
                "$STATUS_DIR/chancela-image-set.json"
            )"
            output="$STATUS_DIR/chancela-$name-signing-status.json"
            node scripts/release-signing-status.mjs container \
              --output "$output" \
              --image "$repository@$digest" \
              --pushed --attested \
              --digest "$digest" \
              --attestation-digest "$platform_digest" \
              --run-url "$RUN_URL" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --registry "ghcr.io" \
              --repository "$repository" \
              --reason-unsigned "Normal CI publication does not use a container signing identity."
            tmp="$(mktemp)"
            jq \
              --arg manifest "chancela-image-set.json" \
              --arg platform_digest "$platform_digest" \
              --arg resolution "$resolution" \
              '. + {
                imageSetManifest: $manifest,
                platformDigest: $platform_digest,
                publicationResolution: $resolution
              }' "$output" > "$tmp"
            mv "$tmp" "$output"
          done

      - name: Validate publication trust declarations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-trust.mjs docker \
            --input "$STATUS_DIR/chancela-server-signing-status.json" \
            --image-set "$STATUS_DIR/chancela-image-set.json" \
            --expect-mode published-unsigned
          node scripts/check-release-trust.mjs docker \
            --input "$STATUS_DIR/chancela-worker-signing-status.json" \
            --image-set "$STATUS_DIR/chancela-image-set.json" \
            --expect-mode published-unsigned
          node scripts/check-release-trust.mjs docker \
            --input "$STATUS_DIR/chancela-search-projector-signing-status.json" \
            --image-set "$STATUS_DIR/chancela-image-set.json" \
            --expect-mode published-unsigned
          {
            echo "### GHCR image set complete"
            echo
            jq -r '
              .images[]
              | "- \(.name): `\(.reference)` (tag `\(.tag)`, \(.resolution))"
            ' "$STATUS_DIR/chancela-image-set.json"
            echo "- Completeness boundary: this workflow is green and the validated \`chancela-image-set.json\` artifact is present."
            echo "- Trust: BuildKit provenance and SBOM attestations are attached; these images are **not cosign-signed**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete image set and publication trust declarations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-publication-trust-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/ghcr-publication/
          if-no-files-found: error
          retention-days: 30
