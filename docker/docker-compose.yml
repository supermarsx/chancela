# Hardened bounded deployment profiles for chancela-server (ARC-40/41/42).
#
# THE API SERVICE, TWICE. `server-sqlite` and `server-postgres` are the SAME
# application compiled two ways: `server-sqlite` is the default cargo build
# (embedded SQLite store), `server-postgres` adds the sqlcipher/postgres/redis
# features. They publish the same host port and are mutually exclusive, which is
# why they sit on disjoint profiles — never enable both at once. Each backend
# profile also starts exactly one matching, unscaled search projector.
#
# PROFILES ARE TWO INDEPENDENT AXES, and they compose:
#
#   BACKEND (pick exactly one — each enables one API + one search projector)
#     single-node   SQLite builds, `server-sqlite` + `search-projector-sqlite`
#     postgres      Postgres/Redis builds, `server-postgres` +
#                   `search-projector-postgres` (+ postgres, redis,
#                   secrets-init, postgres-tls-init)
#
#   SIDECARS (additive, enable no app service of their own)
#     worker        dedicated durable sync/backup worker
#
# Every command below also works from the repo root without `-f` (the root
# docker-compose.yml `include`s this file) and with no `--profile` at all
# (.env pins COMPOSE_PROFILES=single-node as the default):
#
# Single node (SQLite):
#   docker compose --profile single-node up --build
#
# Postgres durability backend plus Redis cache service. The explicit
# acknowledgement is mandatory because the projector role closes PUBLIC ACLs
# at database scope; use only a database dedicated to Chancela:
#   CHANCELA_PROJECTOR_DEDICATED_DATABASE=true \
#     docker compose --profile postgres up --build
#
# Either backend plus the durable sync/backup worker (safe local targets by
# default). The worker mounts the app's data volume, which differs per backend,
# so the postgres form must name it:
#   docker compose --profile single-node --profile worker up --build
#   CHANCELA_APP_DATA_VOLUME=chancela-app-data \
#     docker compose --profile postgres --profile worker up --build
#
# A sidecar profile on its own (`--profile worker`) starts the sidecar with no
# app. That is deliberate: it is what stops `--profile postgres --profile worker`
# from dragging the SQLite app in alongside the Postgres one and colliding on
# ${CHANCELA_HOST_PORT:-8080}.
#
# Security posture:
#   - read_only root filesystem, writable scratch via tmpfs only.
#   - all Linux capabilities dropped.
#   - no-new-privileges: process cannot gain privileges via setuid binaries.
#   - config injected via environment or docker secrets at runtime (never baked into the image).
name: chancela

services:
  server-sqlite:
    profiles:
      - single-node
    build:
      # Context is the repo root so the Dockerfile can see the whole workspace.
      context: ..
      dockerfile: docker/Dockerfile.server
    image: ${CHANCELA_SERVER_IMAGE:-chancela-server:latest}
    # Source-built by default. Green main pushes also publish immutable GHCR
    # artifacts; production overrides may select one explicitly.
    pull_policy: build
    # --- container hardening (ARC-41) ---
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # Writable scratch space; the root filesystem stays read-only.
      - /tmp
    environment:
      # Bind on all interfaces inside the container (host maps the port below).
      CHANCELA_ADDR: 0.0.0.0:8080
      # Keep the server in durable mode; /health must report persistent: true.
      CHANCELA_DATA_DIR: /var/lib/chancela
      # Compose runs indexing in the isolated projector service below. The API
      # hydrates completed durable generations and never performs projector CPU
      # work on a request-serving runtime.
      CHANCELA_SEARCH_RUNTIME: query-only
      CHANCELA_SEARCH_RUNTIME_DIR: /var/lib/chancela/search-projector
      CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS: ${CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS:-600}
      # Signature-provider credentials (CMD/CSC/SCAP API keys and secrets) need a
      # root key to encrypt at rest. Linux containers have no OS credential-sealing
      # provider (that is Windows DPAPI only), so saving one is refused until you
      # supply a key — the server warns about this at startup. Left unset here so a
      # deployment that never configures a provider needs no secret file. To enable,
      # create the secret (see docker/secrets/README.md) and uncomment both lines:
      #   CHANCELA_CREDENTIAL_KEY_FILE: /run/secrets/credential_key
      # plus a matching `secrets:` list on this service. Encrypting the whole SQLite
      # database with CHANCELA_DB_KEY_FILE also satisfies it, and protects more.
    ports:
      - target: 8080
        published: "${CHANCELA_HOST_PORT:-8080}"
        host_ip: 127.0.0.1
    volumes:
      # Durable SQLite store plus every compatibility input used by the
      # projector (`settings.json`, its `settings.pending-audit.json` journal,
      # and legacy backup/privacy JSON documents). Keeping the whole root on
      # one mount lets the projector fail closed on staged/unreadable inputs.
      # The image creates this path as the non-root runtime user so an empty
      # named volume is writable.
      - chancela-data:/var/lib/chancela
    healthcheck:
      test: ["CMD", "/usr/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # Bounded resources so a single-node deployment cannot exhaust the host.
    # `deploy.resources.limits` is honoured by `docker compose up` (v2).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Dedicated SQLite full-search projector. It shares the durable data volume
  # with the single-node API but has its own process, resource budget, runtime
  # heartbeat, and no listening socket.
  # -----------------------------------------------------------------------
  search-projector-sqlite:
    profiles:
      - single-node
    build:
      context: ..
      dockerfile: docker/Dockerfile.search-projector
    image: ${CHANCELA_SEARCH_PROJECTOR_IMAGE:-chancela-search-projector:latest}
    pull_policy: build
    # SQLite projection needs only the shared data volume. Deny outbound
    # network access so a compromised projector cannot exfiltrate that corpus.
    network_mode: none
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp
    environment:
      CHANCELA_DATA_DIR: /var/lib/chancela
      CHANCELA_SEARCH_RUNTIME_DIR: /var/lib/chancela/search-projector
      CHANCELA_SEARCH_HEARTBEAT_SECONDS: ${CHANCELA_SEARCH_HEARTBEAT_SECONDS:-15}
      CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS: ${CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS:-600}
      # Optional friendly lease/heartbeat prefix. When unset the runtime uses
      # the container hostname; blank is deliberately not injected.
      CHANCELA_SEARCH_INSTANCE_ID:
    volumes:
      # Same complete data root as the API: database, settings audit journal,
      # and legacy backup/privacy fallbacks must be observed atomically.
      - chancela-data:/var/lib/chancela
    depends_on:
      server-sqlite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/chancela-search-projector", "healthcheck", "--runtime-dir", "/var/lib/chancela/search-projector"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "${CHANCELA_SEARCH_PROJECTOR_CPUS:-1.5}"
          memory: "${CHANCELA_SEARCH_PROJECTOR_MEMORY:-1g}"
          pids: 128
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Dedicated ARC-20 sync/backup worker. Sync and backup resolve to separate
  # target IDs in the mounted config; the committed example uses two distinct
  # local directories and contains no credential values.
  #
  # BACKEND-AGNOSTIC. This is its own image and its own binary
  # (Dockerfile.worker / chancela-worker), so it works against either backend.
  # `worker` is therefore an ADDITIVE profile that enables no app service of its
  # own — combine it with whichever backend profile you are running:
  #
  #   docker compose --profile single-node --profile worker up -d --build
  #   CHANCELA_APP_DATA_VOLUME=chancela-app-data \
  #     docker compose --profile postgres --profile worker up -d --build
  #
  # It used to sit on the `worker` profile TOGETHER with the SQLite app service,
  # which made `--profile postgres --profile worker` start two app containers on
  # ${CHANCELA_HOST_PORT:-8080} — the second died with "port is already
  # allocated", and there was no way to run a worker against Postgres at all.
  # -----------------------------------------------------------------------
  worker:
    profiles:
      - worker
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: ${CHANCELA_WORKER_IMAGE:-chancela-worker:latest}
    # Source-built by default — see the note on `server-sqlite`.
    pull_policy: build
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      CHANCELA_CONNECTOR_SECRETS_DIR: /run/chancela-connector-secrets
      # Required for every non-local target. Exact hosts only; private DNS
      # destinations also require their resolved IP/CIDR in this list.
      CHANCELA_CONNECTOR_ALLOWED_HOSTS: ${CHANCELA_CONNECTOR_ALLOWED_HOSTS:-}
    volumes:
      # Same durable volume as the API: the API owns sources/staging and the
      # worker owns queue transitions/receipts beneath /worker. WHICH volume that
      # is depends on the backend — `server-sqlite` keeps its data in
      # `chancela-data`, `server-postgres` in `chancela-app-data` — so on the
      # postgres profile this MUST be set to chancela-app-data or the worker
      # watches an empty volume the app never writes to:
      #   CHANCELA_APP_DATA_VOLUME=chancela-app-data
      - ${CHANCELA_APP_DATA_VOLUME:-chancela-data}:/var/lib/chancela
      - ${CHANCELA_WORKER_CONFIG:-./worker-config.example.json}:/etc/chancela-worker/config.json:ro
      - ${CHANCELA_CONNECTOR_SECRETS_HOST_DIR:-./connector-secrets}:/run/chancela-connector-secrets:ro
    depends_on:
      # Wait for whichever app service the chosen backend profile enabled.
      # `required: false` is what lets one sidecar serve both: a dependency on a
      # service that the active profiles did not enable is skipped rather than
      # being an error, so exactly one of these two is ever waited on.
      server-sqlite:
        condition: service_healthy
        required: false
      server-postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "/usr/local/bin/chancela-worker", "healthcheck", "--data-dir", "/var/lib/chancela/worker/queue", "--max-age-seconds", "120"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # `postgres` profile: PostgreSQL durability backend plus a Redis cache service.
  #
  #   docker compose --profile postgres up --build
  #
  # HONEST SCOPE (see docker/DEPLOYMENT-PROFILES.md and wp14.md §0/§4): this is
  # still a SINGLE-WRITER, single-node deployment. Postgres enables PG-native
  # backup/inspection tooling, NOT horizontal scale or HA. The app
  # holds authoritative state in memory and allocates the ledger `seq` in
  # process, so exactly ONE `server-postgres` instance may write. Never scale it.
  # -----------------------------------------------------------------------
  # Populates the secret volumes with the API/Postgres pair, credential key,
  # and independent restricted-projector credential before consumers start.
  #
  # Same shape as postgres-tls-init below, and possible for the same reason:
  # the material lives in a NAMED VOLUME, which compose creates by itself. The
  # earlier host-bind design could not be initialised by a container, because
  # compose creates every container -- validating every bind mount -- before it
  # starts the first one, so a bind to a not-yet-generated file fails (or gets
  # mangled into a directory) before any init service could run.
  #
  # Strictly create-if-absent: an existing value in the volume is never
  # rewritten, and docker/secrets/<name> is adopted when present, so an
  # installation created by preflight-secrets.sh keeps its passwords. See
  # docker/secrets-init.sh for the full ordering and the refusal cases.
  secrets-init:
    profiles:
      - postgres
    image: alpine/openssl:3.5.7@sha256:3da6a24cdaa2f2ac8ef4defb322249fae6159983104653a9e5312f5b75dac7af
    # Root so it can migrate the former combined volume and prepare one
    # read-only, per-secret volume for each explicit consumer set.
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/usr/local/bin/secrets-init.sh"]
    environment:
      # Role/database names only -- NEVER the password. These must match what
      # the `postgres` service creates, or database_url would point at a
      # database that is never created. Compose resolves them from the same
      # .env the postgres service does, so the two cannot disagree.
      CHANCELA_PG_DB: ${CHANCELA_PG_DB:-chancela}
      CHANCELA_PG_USER: ${CHANCELA_PG_USER:-chancela}
    volumes:
      - ./secrets-init.sh:/usr/local/bin/secrets-init.sh:ro
      # Optional: operator-managed secrets. The DIRECTORY is committed (it holds
      # the README and the *.example templates), so this bind always resolves
      # even on a fresh clone -- unlike a bind to the files themselves.
      - ./secrets:/host-secrets:ro
      # Migration source only. No long-running service mounts this legacy
      # combined volume after the split.
      - chancela-secrets:/legacy-secrets:ro
      - chancela-postgres-password:/postgres-password
      - chancela-database-url:/database-url
      - chancela-credential-key:/credential-key
      - chancela-search-password:/search-password
      - chancela-search-secrets:/search-url
      # Read-only probes, used only to answer "does state exist that one of
      # these secrets is the only key to?" before generating anything.
      - chancela-pgdata:/probe/pgdata:ro
      - chancela-app-data:/probe/app-data:ro
    tmpfs:
      - /tmp
    restart: "no"

  # A fresh named volume is owned by root and is not writable by the
  # socketless projector's UID 65532. Reassert only the runtime-volume root
  # ownership before either Postgres API/projector starts; the API later mounts
  # it read-only and the projector receives the sole writable mount.
  search-runtime-init:
    profiles:
      - postgres
    image: alpine/openssl:3.5.7@sha256:3da6a24cdaa2f2ac8ef4defb322249fae6159983104653a9e5312f5b75dac7af
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    entrypoint: ["/bin/sh", "/usr/local/bin/search-runtime-init.sh"]
    volumes:
      - ./search-runtime-init.sh:/usr/local/bin/search-runtime-init.sh:ro
      - chancela-search-runtime:/runtime
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 32m
          pids: 16
    restart: "no"

  postgres-tls-init:
    profiles:
      - postgres
    image: alpine/openssl:3.5.7@sha256:3da6a24cdaa2f2ac8ef4defb322249fae6159983104653a9e5312f5b75dac7af
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-tls-init.sh"]
    volumes:
      - ./postgres-tls-init.sh:/usr/local/bin/postgres-tls-init.sh:ro
      - chancela-pg-tls:/tls
    tmpfs:
      - /tmp
    restart: "no"

  postgres:
    profiles:
      - postgres
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    # The official image drops privileges to the internal `postgres` user for
    # the server process; keep no-new-privileges on top of that.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${CHANCELA_PG_DB:-chancela}
      POSTGRES_USER: ${CHANCELA_PG_USER:-chancela}
      # Password delivered as a file (never inline, never in `environment:` --
      # that would put it in `docker inspect` and in /proc). Written into the
      # its own named volume by `secrets-init`. The role initializer is the only
      # other service allowed to mount this volume.
      POSTGRES_PASSWORD_FILE: /run/postgres-password/postgres_password
    volumes:
      - chancela-postgres-password:/run/postgres-password:ro
      # Named volume for the data directory. Put this on ENCRYPTED storage
      # (LUKS / encrypted block storage) - see DEPLOYMENT-PROFILES.md:
      # Postgres has no transparent whole-DB encryption, so at-rest protection
      # is volume-level, NOT SQLCipher file-level ciphertext.
      # PostgreSQL 18 moved PGDATA below this parent directory so future
      # pg_upgrade --link migrations can operate across versioned children.
      - chancela-pgdata:/var/lib/postgresql
      - chancela-pg-tls:/var/lib/postgresql/tls:ro
    # Not published to the host: the DB is reachable only on the compose
    # network. TLS is still mandatory and hostname/CA verified by the app.
    expose:
      - "5432"
    networks:
      - backend
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$(cat /run/postgres-password/postgres_password)"
          psql "host=localhost port=5432 user=$${POSTGRES_USER} dbname=$${POSTGRES_DB} sslmode=verify-full sslrootcert=/var/lib/postgresql/tls/ca.crt"
          -tAc 'SELECT 1' | grep -qx 1
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    restart: unless-stopped
    depends_on:
      postgres-tls-init:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully

  redis:
    profiles:
      - postgres
    image: redis:8.8.0-alpine3.23@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    # Cache-aside service. Authoritative state stays in the app/Postgres path;
    # cache operations fail open and do not affect correctness.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    security_opt:
      - no-new-privileges:true
    volumes:
      - chancela-redisdata:/data
    expose:
      - "6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 320m
    restart: unless-stopped

  server-postgres:
    profiles:
      - postgres
    build:
      # Context is the repo root so the Dockerfile can see the whole workspace.
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        # Compile the Postgres backend + optional Redis cache into the binary.
        CARGO_FEATURES: "chancela-server/sqlcipher chancela-server/postgres chancela-server/redis"
    image: ${CHANCELA_POSTGRES_IMAGE:-chancela-server:postgres}
    # Source-built by default — see the note on `server-sqlite`.
    pull_policy: build
    # --- container hardening (ARC-41), identical posture to `server-sqlite` ---
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      CHANCELA_ADDR: 0.0.0.0:8080
      # Writable data volume is STILL required on Postgres: the credential
      # sidecar (provider-credentials.enc.json) plus CAE/law/TSL caches and the
      # JSON sidecars live here (wp14.md §1.5).
      CHANCELA_DATA_DIR: /var/lib/chancela
      # Select the Postgres durability backend.
      CHANCELA_DB_BACKEND: postgres
      CHANCELA_SEARCH_RUNTIME: query-only
      CHANCELA_SEARCH_RUNTIME_DIR: /run/chancela-search
      CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS: ${CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS:-600}
      # libpq connection string (incl. the password) as a docker secret. It
      # references the `postgres` service by name on the compose network.
      DATABASE_URL_FILE: /run/database-url/database_url
      CHANCELA_PG_TLS_ROOT_CERT: /run/chancela-postgres-tls/ca.crt
      # Optional shared Redis cache-aside; inert if unreachable (fail-open).
      REDIS_URL: redis://redis:6379
      # REQUIRED on Postgres: the provider-credential store root key. Without
      # SQLCipher there is no DerivedFromDbKey source, so the operator MUST
      # supply this (wp14.md §3). Delivered as a docker secret.
      CHANCELA_CREDENTIAL_KEY_FILE: /run/credential-key/credential_key
    ports:
      - target: 8080
        published: "${CHANCELA_HOST_PORT:-8080}"
        host_ip: 127.0.0.1
    networks:
      - default
      - backend
    volumes:
      - chancela-app-data:/var/lib/chancela
      # Query-only API health observes the projector heartbeat but cannot
      # modify projector-owned runtime state.
      - chancela-search-runtime:/run/chancela-search:ro
      - chancela-pg-tls:/run/chancela-postgres-tls:ro
      - chancela-database-url:/run/database-url:ro
      - chancela-credential-key:/run/credential-key:ro
    depends_on:
      postgres:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
      search-runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      # SINGLE WRITER — never raise this. Two instances against one Postgres
      # are outside this profile's contract: the app keeps authoritative state
      # in memory and allocates ledger `seq` in process. This profile is
      # single-node by design (wp14.md §0/§4).
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    restart: unless-stopped

  # Create/reassert the projector's fixed, least-privilege PostgreSQL role only
  # after the API owner has completed schema migration. The script also logs in
  # with the restricted URL and runs positive/negative ACL probes.
  search-projector-role-init:
    profiles:
      - postgres
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    entrypoint: ["/bin/sh", "/usr/local/bin/search-projector-role-init.sh"]
    environment:
      CHANCELA_PG_DB: ${CHANCELA_PG_DB:-chancela}
      CHANCELA_PG_USER: ${CHANCELA_PG_USER:-chancela}
      CHANCELA_DATABASE_URL_FILE: /run/database-url/database_url
      CHANCELA_POSTGRES_PASSWORD_FILE: /run/postgres-password/postgres_password
      CHANCELA_SEARCH_DATABASE_PASSWORD_FILE: /run/search-password/search_database_password
      CHANCELA_SEARCH_DATABASE_URL_FILE: /run/projector-secrets/search_database_url
      CHANCELA_PG_TLS_ROOT_CERT: /run/chancela-postgres-tls/ca.crt
      # Required acknowledgement: the role initializer revokes database-global
      # PUBLIC ACLs and is safe only when this database belongs to Chancela.
      CHANCELA_PROJECTOR_DEDICATED_DATABASE: ${CHANCELA_PROJECTOR_DEDICATED_DATABASE:-}
    volumes:
      - ./search-projector-role-init.sh:/usr/local/bin/search-projector-role-init.sh:ro
      - chancela-postgres-password:/run/postgres-password:ro
      - chancela-database-url:/run/database-url:ro
      - chancela-search-password:/run/search-password:ro
      - chancela-search-secrets:/run/projector-secrets:ro
      - chancela-pg-tls:/run/chancela-postgres-tls:ro
    tmpfs:
      - /tmp:size=16m
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
      search-runtime-init:
        condition: service_completed_successfully
      server-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
          pids: 64
    restart: "no"

  # One unscaled projector owns the derived search generation for every
  # Postgres API node. It exposes no ingress and reads the non-DB source corpus
  # from the application data volume without write access.
  search-projector-postgres:
    profiles:
      - postgres
    build:
      context: ..
      dockerfile: docker/Dockerfile.search-projector
    image: ${CHANCELA_SEARCH_PROJECTOR_IMAGE:-chancela-search-projector:latest}
    pull_policy: build
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp
    environment:
      CHANCELA_DATA_DIR: /var/lib/chancela
      CHANCELA_SEARCH_RUNTIME_DIR: /run/chancela-search
      CHANCELA_SEARCH_HEARTBEAT_SECONDS: ${CHANCELA_SEARCH_HEARTBEAT_SECONDS:-15}
      CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS: ${CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS:-600}
      CHANCELA_SEARCH_INSTANCE_ID:
      CHANCELA_DB_BACKEND: postgres
      CHANCELA_SEARCH_DATABASE_URL_FILE: /run/secrets/search_database_url
      CHANCELA_PG_TLS_ROOT_CERT: /run/chancela-postgres-tls/ca.crt
      # This process projects derived search rows only. It must never acquire
      # the authoritative ledger-writer advisory lock while the API restarts.
      CHANCELA_NODE_ROLE: follower
    volumes:
      # Non-DB corpus sidecars and legacy backup/privacy fallbacks are inputs
      # only on Postgres. Keep heartbeat writes in their own volume so this
      # complete application-data root can remain read-only.
      - chancela-app-data:/var/lib/chancela:ro
      - chancela-search-runtime:/run/chancela-search
      - chancela-pg-tls:/run/chancela-postgres-tls:ro
      # Contains the restricted projector URL only; the API owner URL and
      # provider signing secrets stay outside this container.
      - chancela-search-secrets:/run/secrets:ro
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
      search-runtime-init:
        condition: service_completed_successfully
      server-postgres:
        condition: service_healthy
      search-projector-role-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/chancela-search-projector", "healthcheck", "--runtime-dir", "/run/chancela-search"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "${CHANCELA_SEARCH_PROJECTOR_CPUS:-1.5}"
          memory: "${CHANCELA_SEARCH_PROJECTOR_MEMORY:-1g}"
          pids: 128
    restart: unless-stopped

networks:
  # Normal ingress/outbound network used by the API and optional worker.
  default:
    driver: bridge
  # Database/cache plane. `internal` removes a host/outbound route; only the
  # API's second interface and the restricted projector/initializer attach.
  backend:
    driver: bridge
    internal: true

volumes:
  chancela-data:
  chancela-pgdata:
  chancela-pg-tls:
  chancela-redisdata:
  chancela-app-data:
  chancela-search-runtime:
  chancela-postgres-password:
  chancela-database-url:
  chancela-credential-key:
  chancela-search-password:
  chancela-search-secrets:
  # Legacy combined secret volume. It remains declared only so secrets-init can
  # migrate existing installations into the per-secret volumes above. No
  # long-running service mounts it.
  #
  #   docker compose --profile postgres up -d
  #
  # This replaces the former top-level `secrets:` block, whose `file:` entries
  # pointed at gitignored host paths: compose only WARNS about a missing secret
  # file and hands the path to the daemon anyway, which fails the container with
  # `bind source path does not exist` or silently creates a DIRECTORY there.
  # A named volume has neither failure mode and can be filled by an init
  # service, which a bind cannot.
  #
  # Existing values are read-only migration inputs; split destination values
  # are strict create-if-absent and validated as redacted password/URL pairs.
  chancela-secrets:
