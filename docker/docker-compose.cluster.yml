# wp16 — multi-node (single-writer leader + read-followers) OVERLAY for the `postgres` profile.
#
# This is an ADDITIVE infrastructure overlay: it adds one scaled app service
# (`chancela-cluster`) while explicitly moving the base file's single-node
# `server-postgres` service behind a profile that the documented cluster command
# does not select. Use it together with the base compose so the shared
# `postgres`, `redis`, secrets, and network still exist:
#
#   docker compose \
#     -f docker/docker-compose.yml -f docker/docker-compose.cluster.yml \
#     --profile postgres --profile cluster up --build
#
# Set CHANCELA_PROJECTOR_DEDICATED_DATABASE=true only after confirming the
# target database is dedicated to Chancela; the projector initializer revokes
# database-global PUBLIC ACLs and refuses to run until it is set. Use ONE of
# these — the `.env` form is the only one identical on every platform. Compose
# takes `.env` from the directory of the FIRST `-f` file, so here that is
# docker/.env:
#
#   .env (uncomment the line already present in docker/.env)
#     CHANCELA_PROJECTOR_DEDICATED_DATABASE=true
#
#   PowerShell — a SEPARATE statement. PowerShell has no inline
#   `VAR=value command` prefix, so the bash form below leaves it unset:
#     $env:CHANCELA_PROJECTOR_DEDICATED_DATABASE = "true"
#
#   bash / zsh — prefix the command:
#     CHANCELA_PROJECTOR_DEDICATED_DATABASE=true docker compose \
#       -f docker/docker-compose.yml -f docker/docker-compose.cluster.yml \
#       --profile postgres --profile cluster up --build
#
# The N replicas point at ONE Postgres. Exactly one is elected the writer via the advisory lock
# (`CHANCELA_NODE_ROLE=auto`); the rest serve reads and 307-redirect writes to the leader. This is the
# precise inversion of the base file's "never scale the writer": it is safe to scale the *service*
# because only one *instance* ever writes (see docs/HA-FAILOVER.md).
#
# Ingress: put a leader-aware load balancer in front (route writes to the leader via /health role,
# reads to any node), or rely on 307 redirects for direct clients that follow cross-host redirects.
# The replicas deliberately do NOT publish a fixed host port (replicas cannot share one); the LB owns
# ingress. Scale with:  docker compose ... up --scale chancela-cluster=3
#
# ⚠️ Non-ledger sidecars (wp16 §8.2): the five file sidecars (users/roles/delegations/settings/
# provider-credentials) are DB-backed on Postgres (wp16 P3b), so they are shared across replicas. The
# remaining on-disk state (CAE/law/TSL caches) is regenerable per node. Sessions + rate-limits are
# shared via Redis (required in multi-node). Do NOT run multi-node for legal data before the soak run
# documented in docs/HA-FAILOVER.md.

services:
  # The base service shares the `postgres` profile with the database
  # infrastructure. Replace that profile in this overlay so selecting
  # `postgres + cluster` cannot accidentally start a fourth, non-elected API
  # writer beside the scaled leader/follower service.
  server-postgres:
    profiles: !override
      - single-node-postgres

  # Extend the base initializer's state probe to the cluster API data volume.
  # A missing credential key must never be regenerated over an existing
  # provider-credential store merely because the single-node volume is empty.
  secrets-init:
    environment:
      CHANCELA_CLUSTER_DATA_PROBE: /probe/cluster-data
    volumes:
      - chancela-cluster-data:/probe/cluster-data:ro

  chancela-cluster:
    profiles:
      - cluster
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        CARGO_FEATURES: "chancela-server/sqlcipher chancela-server/postgres chancela-server/redis"
        # Keep this in step with CARGO_FEATURES above; it names the BuildKit
        # target-directory cache this build reuses and affects rebuild time only.
        # Deliberately the same value as the base file's `server-postgres`: this
        # service compiles the same package with the same features, so the two
        # SHOULD share one warm directory. See docker/Dockerfile.server.
        CARGO_TARGET_CACHE_ID: "server-sqlcipher-postgres-redis"
    image: ${CHANCELA_POSTGRES_IMAGE:-chancela-server:postgres}
    # Source-built by default; green main pushes also publish immutable GHCR
    # artifacts that a production override may select explicitly.
    pull_policy: build
    # --- identical container hardening posture to the base app service ---
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      CHANCELA_ADDR: 0.0.0.0:8080
      CHANCELA_DATA_DIR: /var/lib/chancela
      CHANCELA_DB_BACKEND: postgres
      DATABASE_URL_FILE: /run/database-url/database_url
      CHANCELA_PG_TLS_ROOT_CERT: /run/chancela-postgres-tls/ca.crt
      # Redis is REQUIRED in multi-node: cluster-wide sessions + global sign-in rate-limits.
      REDIS_URL: redis://redis:6379
      CHANCELA_CREDENTIAL_KEY_FILE: /run/credential-key/credential_key
      # The unscaled search-projector-postgres service from the base postgres
      # profile owns indexing. Every API replica remains a query/hydration node.
      CHANCELA_SEARCH_RUNTIME: query-only
      CHANCELA_SEARCH_RUNTIME_DIR: /run/chancela-search
      CHANCELA_SEARCH_HEARTBEAT_SECONDS: ${CHANCELA_SEARCH_HEARTBEAT_SECONDS:-15}
      CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS: ${CHANCELA_SEARCH_HEALTH_MAX_AGE_SECONDS:-600}
      # Elect via the advisory lock: one leader, the rest followers.
      CHANCELA_NODE_ROLE: auto
      # Leader self-fence watchdog: re-verify lock+epoch every 3s and step down (fail-closed) on any
      # partition / wedge. Set below CHANCELA_NODE_STALE_AFTER (10s) so a fenced leader stops writing
      # well before followers would still treat its advertised address as fresh.
      CHANCELA_LEADER_WATCHDOG_INTERVAL: "3"
      # NOTE: CHANCELA_ADVERTISED_URL must be a per-node externally-reachable URL for 307 redirects.
      # Compose replicas share this environment, so for real 307 ingress prefer a leader-aware LB that
      # reads /health role, or run one service per node with a distinct advertised URL each.
    volumes:
      # The cluster data root also carries any pre-singleton backup/privacy
      # compatibility sidecars; the projector mounts this same root read-only.
      - chancela-cluster-data:/var/lib/chancela
      - chancela-search-runtime:/run/chancela-search:ro
      - chancela-pg-tls:/run/chancela-postgres-tls:ro
      # Per-secret volumes from the base `secrets-init` service. The cluster
      # replicas receive only their database URL and credential-store key.
      - chancela-database-url:/run/database-url:ro
      - chancela-credential-key:/run/credential-key:ro
    networks:
      - default
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      secrets-init:
        condition: service_completed_successfully
      search-runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      # SAFE to scale here (unlike the base single-node service): the advisory-lock election makes
      # N-1 of these followers. Raise via `--scale chancela-cluster=N`.
      replicas: ${CHANCELA_CLUSTER_REPLICAS:-3}

  # The base Postgres profile waits for its single-node API before starting the
  # role initializer. In cluster mode there must be no fourth API, so replace
  # that dependency with the scaled API service.
  search-projector-role-init:
    depends_on: !override
      postgres:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
      search-runtime-init:
        condition: service_completed_successfully
      chancela-cluster:
        condition: service_healthy

  # The base Postgres projector waits for its single-node API. Replace that
  # dependency with the scaled API service and the verified role initializer,
  # and share the cluster's app-data volume instead.
  search-projector-postgres:
    depends_on: !override
      postgres:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
      search-runtime-init:
        condition: service_completed_successfully
      chancela-cluster:
        condition: service_healthy
      search-projector-role-init:
        condition: service_completed_successfully
    volumes:
      # Preserve access to legacy backup/privacy fallbacks during upgrades;
      # DB singleton documents remain authoritative when present.
      - chancela-cluster-data:/var/lib/chancela:ro

volumes:
  # Shared cache volume for the replicas. Ledger + the five sidecars are authoritative in Postgres;
  # only regenerable caches live here.
  chancela-cluster-data:
